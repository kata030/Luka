==============================================================================
 LUKA WEB  —  pressure losses in air ductwork, in one HTML file
==============================================================================
 Browser port of HRI-Luka (Python/Tk, TU Berlin, Hermann-Rietschel-Institut).
 Draw a duct network, calculate volume flows and pressures, size fans,
 export results to Excel. No server, no build step: open this file in a
 current Chrome, Edge, Firefox or Safari.

 THIS COMMENT IS THE PROJECT DOCUMENTATION. If you are an AI assistant or a
 developer picking this file up, read it fully before changing code.

------------------------------------------------------------------------------
 1. RUNNING
------------------------------------------------------------------------------
 - Double-click luka.html, or serve it from any static host.
 - Needs internet on first load: React, ReactDOM, htm and React Flow are
   loaded from cdn.jsdelivr.net (exact pinned versions, see §6). Fonts come
   from Google Fonts with system fallbacks. Everything else is in this file.
 - Offline use: download the four script URLs in §6 and paste each file's
   content into its <script> tag instead of the src attribute (same for the
   React Flow stylesheet). The app itself needs nothing else.
 - URL options: ?example       loads the first embedded example network
                ?example=<id>  loads a specific one (ids listed in §7)
                ?selftest      opens the self-test report on start
 - The current project is autosaved in localStorage (key luka-web.autosave.v1)
   and restored on the next start. Projects are saved as *.luka.json.
 - Appearance: View > Appearance = Automatic (default, follows the system),
   Light or Dark; remembered in this browser.

------------------------------------------------------------------------------
 3. ARCHITECTURE AND CONVENTIONS
------------------------------------------------------------------------------
 - Layering: CORE knows nothing about IO or UI; IO uses CORE; UI uses both.
   Keep it that way: physics never goes into UI code (the legacy app mixed
   them, e.g. bend ζ tables were computed in the property editor).
 - Single source of truth: the project document `doc` (format in §2 header).
   UI state lives in one tiny store (§4.1, useSyncExternalStore). Every edit
   goes through commit(mutator, {history, physics}); mutators return a NEW
   doc (immutable updates). physics:false = layout-only change (positions,
   names, rotation, background): no recalculation, results stay valid.
 - Undo/redo: snapshots of `doc` (max 100). Drags push one snapshot at the
   start of the gesture.
 - Align/distribute (Edit menu + multi-selection panel): alignSelection(mode)
   in §4.5, modes left|center|right|top|middle|bottom|distH|distV; reference
   is the bounding box of the selected symbol centres (PowerPoint semantics);
   layout-only commit (physics:false), one undo step.
 - Duplicate (Edit menu, Ctrl+D, panel buttons): duplicateSelection() in
   §4.5. Copies selected components (props, names, rotation, relative
   layout) with new ids; copies ONLY connections whose both ends are in the
   selection. Placement: bounding-box centre of the copy = centre of the
   current view (viewCentre(), also used by palette clicks); if a copy
   would cover any existing symbol (±70 px in x, ±90 px in y incl. label),
   the nearest free offset on an 80 px grid (DUP_OFFSET) around the view
   centre is used, and the view pans there (same zoom) if it is outside
   the visible area. The copies become the selection. One undo step;
   undo/redo prune selected ids that no longer exist.
 - React Flow runs CONTROLLED: nodes/edges are derived from doc in
   Editor (§4.5); onNodesChange / onEdgesChange translate RF changes back
   (positions, selection, background resize). Deletion uses onDelete.
   connectionMode "loose": every port is a source handle; a connection is
   undirected. Node positions in doc are symbol CENTRES (RF uses top-left,
   offset NODE/2 = 26 px).
 - Calculation runs in a Web Worker created from the text of
   <script id="luka-core"> (Blob URL); fallback: main thread. With
   Auto-calculate on, a recalculation is scheduled 250 ms after each
   physics-relevant edit. Results are never saved; they are recomputed.
 - UI code uses htm tagged templates instead of JSX:
     html`<${Comp} a=${x}><div className="y">${child}</div><//>`
   Use className, camelCase SVG attributes, style objects.
 - SI units in doc and core (m, m³/s, Pa). The UI shows flows in m³/h,
   section sizes, roughness and bend radius in mm (FIELDS scale, §4.4).
 - Drawing colours (View > Colour the drawing by, store.colorBy):
   'power' (default): coloured border = hydraulic power loss Δp·Q in W
   (core result 'ploss'; tees Σ p_port·Q_in,port, which equals the sum
   over their legs; fans give 'pfan' instead and are not coloured).
   Σ ploss over all components = Σ fan power (self-test).
   'loss': coloured border = pressure loss, max − min of the port
   pressures (tees: largest leg difference). Both use the scale pale →
   yellow → orange → red on √(value/max) (RING_METRICS, componentPower,
   componentLoss, lossColor, LossLegend in §4.3/§4.5).
   'pressure': connections and ports coloured by gauge pressure (diverging
   blue/orange).
   'throttle': ONLY flow controllers get a border, coloured by their
   throttling pressure (core result 'dpThrottle' = Δp − ζopen·ρ/2·v²) on
   √(value/max): teal = fully open (≤ THROTTLE_OPEN_TOL = 0.05 Pa, extra
   halo, the critical path in fan sizing) → yellow → orange → red = most
   throttled; magenta = lacks pressure (negative throttling, fixed fans
   only). Controller badges then show "fully open" / "throttles … Pa";
   ThrottleLegend lists the fully open controllers (click to show them).
   (componentThrottle, throttleColor, THROTTLE_STOPS in §4.3/§4.5.)
   'none': no colours.
 - Styling: CSS variables in §5; dark mode via prefers-color-scheme or
   <html data-theme="dark|light">. View > Appearance sets the theme:
   'auto' (default, no data-theme, follows the system), 'light', 'dark';
   stored in localStorage key luka-web.theme.v1 (absent = auto), applied
   before the first render (applyTheme in §4) and passed to React Flow's
   colorMode.

------------------------------------------------------------------------------
 4. PHYSICS AND NUMERICS  (calculation model version 2)
------------------------------------------------------------------------------
 Network:
 - Each component contributes elements between its ports (and internal
   nodes, e.g. the tee centre). Ports joined by connections are merged into
   one node (union-find): connections are ideal, loss-free junctions, and
   any number of ports may meet in one point.
 - A port without a connection is OPEN: gauge pressure 0 (atmosphere), its
   inflow/outflow is a result. This is the pressure reference.
 - Element kinds: resist (unknown Q, Δp = f(Q)), fixed (prescribed Q: fans,
   flow controllers; their Δp is a result), rise (fan sizing), const (fixed
   Δp component: prescribed Δp, unknown Q).
 - Equations: mass balance at every non-open node; p_a − p_b = f(Q) for
   every resist element. Positive Q flows from the element's first to its
   second node (in → out; for tees in→centre, centre→out, branch→centre).
 Pressure-loss laws (v = Q/A with the real area A, D_h = 4A/U):
 - zeta:   Δp = ζ·ρ/2·v²
 - duct:   Δp = λ(Re, k/D_h)·L/D_h·ρ/2·v²,  Re = v·D_h/ν
           λ from Churchill (1977): one smooth formula for laminar,
           transitional and turbulent flow.
 - zetaRe: ζ(Re) from a table (Akima interpolation identical to scipy's
           Akima1DInterpolator, constant outside the table) or a power law
           ζ = ζref·(Re/2·10⁵)^−n evaluated at the table points.
 - bendRe: ζ(Re) table generated from the Krüger correlation (round: R/D;
           rectangular: R/W plus Miller K_b(H/W, R/W) − Krüger(10⁶, smooth));
           optional shift so that ζ(2·10⁵) = ζref.
 - tee:    three ζ legs (in, out, branch) with their own sections.
 - fan:    fixed Q; result: pressure rise p_out − p_in.
 - controller: fixed set flow Q; result: Δp across it, the throttling
           pressure Δp − ζopen·ρ/2·v² and the required throttling ζ.
 - fixedDp: p_out − p_in = Δp (input; negative = loss, positive = rise), the
           same at every flow, also at zero or reverse flow. Results: Q, v, Re
           and the effective ζ = (p_in − p_out)/(ρ/2·v²)·sign(Q) (– at Q ≈ 0,
           negative when the component adds energy). Warnings for reverse
           flow (a fixed loss then acts like a fan) and for zero flow. It is a
           design-point model: Δp from a data sheet holds at its nominal flow
           only (UI: "Convert to fixed ζ" turns it into Δp ∝ Q²).
 - fanSizing: element with p_out − p_in = Δp_fan. Δp_fan is found by an
           outer secant loop so that min(throttling pressure over all
           controllers) = 0, i.e. the most critical controller is fully
           open. (Exactly linear if all flows are prescribed: converges in
           one step.)
 Fluid: "air" → ρ = p/(287.05·T), μ Sutherland, ν = μ/ρ; or custom ρ, ν.
 Solver (§1.9, §1.10):
 - Unknowns: pressures of non-open nodes and flows of resist/rise elements.
 - Newton steps are reduced to the node pressures (Schur complement): the
   matrix is a weighted graph Laplacian Σ (1/f'(Q))·incidence, symmetric
   positive definite, solved by reverse Cuthill–McKee ordering + envelope
   Cholesky. 4 Picard (secant) sweeps as warm start, then Newton with
   backtracking line search. f'(Q) by local central differences per
   element; floored at 0.01 Pa/(m³/s) in the JACOBIAN ONLY, so zero-ζ legs
   and stagnant branches stay solvable while residuals stay exact. Constant-Δp
   elements (const, rise) have f' = 0 and use the floor; they enter the
   Picard sweeps as an offset f0 with the floor conductance. Their |Δp| is
   included in the pressure scale of the merit function.
 - Constant-Δp loop check (checkConstLoops): const/rise elements must not
   form a loop on their own; all open ports count as ONE node (atmosphere).
   In such a loop the flow is undefined (equal Δp) or no solution exists;
   the Jacobian floor would otherwise return an arbitrary flow split (or not
   converge). Loops containing a resist or fixed-flow element are fine.
   A fixedDp with both ports open is the one-element case of this error.
 - Robustness test (Oct 2026): in all 9 examples, 5 %…100 % of the ducts and
   ζ fittings were replaced by fixedDp (40 random draws per fraction): with
   Δp at the operating point (results reproduced within 2e-7 Pa, 5e-6 m³/h),
   scaled 0.3…3×, 30 % turned into boosters of +20…320 Pa, Δp = 0, and
   random −500…+500 Pa. All 9 045 runs converged; Newton iterations per
   calculation (all solves) rose from 1–6 to at most 14, on average by 1–4
   (networks whose flows are all prescribed: unchanged); energy balance
   Σ ploss = Σ fan power within 1e-12 (relative).
 - Convergence: max mass residual < 1e-10 m³/s and max pressure residual
   < 1e-7 Pa (+1e-10 relative).
 - Before solving, every pressure region (connected through non-fixed
   elements) is checked: without an open port its fixed flows must balance
   (else error) and one node is pinned to 0 Pa (warning).
 - Speed: example networks (135 components) solve in ~15 ms; a 6000-
   component tree in ~0.5 s. The legacy scipy solver needed 66–76 s for the
   office examples (numerical Jacobian over all unknowns).
 Changes against the legacy Python model (all intentional, see § FIX
 comments in the code):
   1. Re used ρ·ν with ν = 1.81e-5 (a dynamic viscosity) → Re ≈ 1.5×
      too low. Now Re = v·D_h/ν with a true kinematic viscosity.
   2. Rectangular ducts used the area-equivalent diameter for λ, Re and
      L/D. Now hydraulic diameter for Re, k/D_h and L/D_h.
   3. Friction factor: laminar/Colebrook switch at Re = 3000 (2320 in the
      bend code) and Colebrook clamped to λ ∈ [0.01, 0.1] → Churchill.
   4. Miller bend table: 14 values but 10 R/W breakpoints, wrong array in
      the square branch → breakpoints 0.5…1 (step 0.1), 1.5…5 (step 0.5).
      (Assumed from the chart range; confirm against Miller if in doubt.)
   5. Bends below Re = 2320 returned ζ = 0 → ζ held at its Re = 2320 value.
   6. Fan result was p_in + p_out → now the pressure rise p_out − p_in.
   7. Flow controller Re used a hard-coded 1.82e-5 → removed (uses fluid).
   8. Controller "zeta" was overwritten by every run → now an explicit
      ζopen input (default 0, = legacy behaviour) plus a ζ result.
 With fix 1 neutralised in the legacy code, results agree with the legacy
 solver within 0.1–0.3 % on the example networks (remaining difference:
 Churchill vs. Colebrook). Fan sizing on the office example with its original
 set flows (212–308 m³/h): 490.1 Pa
 (legacy 489.9 Pa).

------------------------------------------------------------------------------
 5. COMPONENT CATALOGUE  (type / kinds / ports / props, SI units)
------------------------------------------------------------------------------
 duct       duct                      in,out          length, roughness k, section
 zeta       bend, filter, fireDamper, smokeDamper, soundAbsorber, throttle,
            custom                    in,out          zeta, section
 zetaRe     same kinds as zeta        in,out          mode powerLaw|table, zetaRef,
                                                      n, reTable[], zetaTable[], section
 bendRe     bend                      in,out          radius, zetaRef (0 = auto),
                                                      relRoughness, reTable[], section
 tee        tee                       in,out,branch   zetaIn, zetaOut, zetaBranch,
                                                      sectionIn/Out/Branch
 fan        generic, axial, radial    in,out          flow
 fanSizing  sizing                    in,out          –
 controller controller                in,out          flow, zetaOpen, section
 fixedDp    fixedDp                   in,out          dpFixed (= p_out − p_in, Pa;
                                                      < 0 loss, > 0 rise), section
 UI "ζ model" switch (§1.11 switchModel, §4.6 ModelSwitch): the palette has one
 entry per fitting kind (type zeta); the switch maps models to the three types:
 fixed = zeta, powerLaw/table = zetaRe (props.mode), correlation = bendRe
 (bends only). Settings of inactive models are kept in props.stash[type] and
 restored on switching back; the solver ignores stash. Without stash the
 conversion keeps Δp at the operating point (fresh results; else at
 Re = 2·10⁵): exactly for fixed, table and fixed → power law (n = 0); within
 about 1 % for curve → power law (log-log fit of n) and → correlation
 (shifted via zetaRef; radius set to R/W = 1). Several fittings can be
 switched at once (multi-selection panel; one undo step).
 section = {shape:'round', d} | {shape:'rect', w, h}   (rect: w = width in
 the plane of a bend). `kind` only selects symbol and label; `type`
 selects the physics.

 7. TESTING
------------------------------------------------------------------------------
 - In the app: Help > Run self-tests (or open with ?selftest).
 - Headless in Node 18+ (extract the three script blocks and run the tests;
   .pop() takes the LAST match because this comment also mentions the tags):
     node -e "const h=require('fs').readFileSync('luka.html','utf8');
       for (const id of ['luka-core','luka-io','luka-tests'])
         eval(h.split('<script id=\"'+id+'\">').pop().split('</script>')[0]);
       for (const t of LukaTests.runTests()) console.log(t.ok?'PASS':'FAIL', t.name);"
 - Visual check: open ?example=office-controlled, the drawing should show the
   office supply network, status bar "Converged", required fan pressure
   ≈ 370.5 Pa. All examples must load and converge.

 8. LIMITATIONS AND IDEAS (from the original wishlist, not done yet)
------------------------------------------------------------------------------
 - Tee ζ values are constant inputs (no automatic ζ from flow ratios).
 - No fan curves (fans are fixed-flow or sized); no duct leakage.
 - Nominal-pressure-loss input that scales with flow (Δp_nom at Q_nom,
   Δp ∝ Q²); today: fixedDp (flow-independent) + "Convert to fixed ζ".
 - Part-load sweeps / system
   curve, a ζ database, automatic duct sizing, snap-to-grid.
 - Connections are drawn as straight lines; they carry no length or loss
   (use a duct component for that).

.menu-list button:hover:not(:disabled) { background: var(--accent-soft); }
.menu-list button:disabled { color: var(--muted); cursor: default; }

.ex-list { display: grid; gap: 6px; margin-top: 6px; }
.model-switch { margin: 10px 0 4px; }

.align-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 6px 0 2px; }
.btn:disabled { opacity: .45; cursor: default; }

.actions { margin-left: auto; display: flex; align-items: center; gap: 14px; }

.legend-swatch { flex: none; width: 10px; height: 10px; border-radius: 2px; background: var(--sw); }

.ln-text { position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); text-align: center; white-space: nowrap; font-size: 11px; line-height: 1.2; pointer-events: none; }

.toast.error { background: var(--err); color: #fff; }

.overlay { position: fixed; inset: 0; background: rgba(10, 20, 25, .45); display: grid; place-items: center; z-index: 90; padding: 16px; }
.dialog { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; width: min(720px, 100%); max-height: 88vh; display: flex; flex-direction: column; }

<script id="luka-core">
/* ===========================================================================
 * §1 CORE  —  physics, component registry, network assembly, solver
 * ---------------------------------------------------------------------------
 * Pure JavaScript, no DOM access. The same text runs
 *   - in the page (window.LukaCore),
 *   - in a Web Worker created from this <script> block's text,
 *   - in Node for headless tests (globalThis.LukaCore).
 * Units: SI everywhere (m, m², m³/s, Pa, kg/m³, m²/s). The UI converts
 * volume flows to m³/h for display only.
 * ======================================================================== */
(function (root) {
  'use strict';

  const CALC_MODEL_VERSION = 2;

  /* ---------------------------------------------------------------------
   * §1.1 Fluid properties
   * mode "air":    ρ from ideal gas (R = 287.05 J/kgK), μ from Sutherland,
   *                ν = μ/ρ.  20 °C, 101325 Pa → ρ ≈ 1.204, ν ≈ 1.51e-5
   * mode "custom": user supplies density [kg/m³] and kinViscosity [m²/s].
   * FIX (vs. legacy Python): legacy stored 1.81e-5 (a DYNAMIC viscosity of
   * air) as "kinematic viscosity" and used ρ·ν as Re denominator → Re ~1.5×
   * too low. Here Re = v·D_h/ν with a true kinematic viscosity.
   * ------------------------------------------------------------------- */
  const R_AIR = 287.05;
  function airProperties(tC, pPa) {
    const T = tC + 273.15;
    const rho = pPa / (R_AIR * T);
    const mu = 1.458e-6 * Math.pow(T, 1.5) / (T + 110.4);
    return { rho, mu, nu: mu / rho };
  }
  function resolveFluid(f) {
    f = f || {};
    if (f.mode === 'custom') {
      const rho = +f.density, nu = +f.kinViscosity;
      if (!(rho > 0) || !(nu > 0)) throw new Error('Custom fluid needs positive density and kinematic viscosity.');
      return { rho, nu, mu: rho * nu };
    }
    return airProperties(f.temperatureC ?? 20, f.pressurePa ?? 101325);
  }

  /* ---------------------------------------------------------------------
   * §1.2 Cross-sections
   * {shape:'round', d} or {shape:'rect', w, h}  (metres)
   * A = flow area, Dh = hydraulic diameter (4A/U), W/H = width/height
   * (round: W = H = d). Velocities always use the real area A.
   * ------------------------------------------------------------------- */
  function sectionGeom(s) {
    if (!s) throw new Error('missing cross-section');
    if (s.shape === 'rect') {
      const w = +s.w, h = +s.h;
      if (!(w > 0 && h > 0)) throw new Error('rectangular section needs width and height > 0');
      return { A: w * h, Dh: 2 * w * h / (w + h), W: w, H: h, round: false };
    }
    const d = +s.d;
    if (!(d > 0)) throw new Error('round section needs a diameter > 0');
    return { A: Math.PI * d * d / 4, Dh: d, W: d, H: d, round: true };
  }
  function sectionLabel(s) {
    if (!s) return '';
    return s.shape === 'rect' ? `${fmt(s.w * 1000, 0)}×${fmt(s.h * 1000, 0)} mm` : `Ø${fmt(s.d * 1000, 0)} mm`;
  }

  /* ---------------------------------------------------------------------
   * §1.3 Darcy friction factor — Churchill (1977)
   * One smooth formula for laminar, transitional and turbulent flow.
   * FIX: replaces legacy laminar/Colebrook switch at Re = 3000 (2320 in the
   * bend code) and the Colebrook root search clamped to λ ∈ [0.01, 0.1].
   * relRough = k / D_h.
   * ------------------------------------------------------------------- */
  function frictionFactor(Re, relRough) {
    Re = Math.max(Re, 1e-12);
    const a = 2.457 * Math.log(1 / (Math.pow(7 / Re, 0.9) + 0.27 * relRough));
    const A = Math.pow(a, 16);
    const B = Math.pow(37530 / Re, 16);
    return 8 * Math.pow(Math.pow(8 / Re, 12) + 1 / Math.pow(A + B, 1.5), 1 / 12);
  }

  /* ---------------------------------------------------------------------
   * §1.4 Akima interpolation (identical to scipy.interpolate.
   * Akima1DInterpolator, method "akima") with constant extrapolation
   * outside the table (= legacy np.interp behaviour).
   * ------------------------------------------------------------------- */
  function makeAkima(x, y) {
    const n = x.length;
    if (n < 2 || y.length !== n) throw new Error('ζ(Re) table needs ≥ 2 points and equal lengths');
    for (let i = 1; i < n; i++) if (!(x[i] > x[i - 1])) throw new Error('Re table must be strictly increasing');
    const t = new Array(n);
    if (n === 2) {
      const s = (y[1] - y[0]) / (x[1] - x[0]); t[0] = t[1] = s;
    } else {
      const m = new Array(n + 3);
      for (let i = 0; i < n - 1; i++) m[i + 2] = (y[i + 1] - y[i]) / (x[i + 1] - x[i]);
      m[1] = 2 * m[2] - m[3]; m[0] = 2 * m[1] - m[2];
      m[n + 1] = 2 * m[n] - m[n - 1]; m[n + 2] = 2 * m[n + 1] - m[n];
      const f12 = new Array(n);
      let fmax = -Infinity;
      for (let i = 0; i < n; i++) {
        const f1 = Math.abs(m[i + 3] - m[i + 2]), f2 = Math.abs(m[i + 1] - m[i]);
        f12[i] = [f1, f2, f1 + f2]; fmax = Math.max(fmax, f1 + f2);
      }
      for (let i = 0; i < n; i++) {
        const [, f2, s] = f12[i];
        t[i] = s > 1e-9 * fmax ? m[i + 1] + (f2 / s) * (m[i + 2] - m[i + 1]) : 0.5 * (m[i + 3] + m[i]);
      }
    }
    return function (xv) {
      if (xv <= x[0]) return y[0];
      if (xv >= x[n - 1]) return y[n - 1];
      let lo = 0, hi = n - 1;
      while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (x[mid] > xv) hi = mid; else lo = mid; }
      const h = x[hi] - x[lo], s = (xv - x[lo]) / h, s2 = s * s, s3 = s2 * s;
      return (2 * s3 - 3 * s2 + 1) * y[lo] + (s3 - 2 * s2 + s) * h * t[lo] + (-2 * s3 + 3 * s2) * y[hi] + (s3 - s2) * h * t[hi];
    };
  }

  /* ---------------------------------------------------------------------
   * §1.5 90° bend loss coefficient (Krüger correlation, rectangular
   * correction from Miller, Internal Flow Systems).
   * relRough = k/D, rd = R/D (round) or R/W (rect).
   * FIX: below Re = 2320 legacy returned ζ = 0 ("Re is too low!");
   *      now ζ is held at its Re = 2320 value.
   * FIX: Miller table had 14 values but 10 R/W breakpoints and the square
   *      branch interpolated against the wrong array. Breakpoints now
   *      0.5…1 (0.1 steps), 1.5…5 (0.5 steps) = 14 points, linear interp.,
   *      clamped outside 0.5…5.
   * FIX: friction factor inside the correlation uses Churchill (§1.3).
   * ------------------------------------------------------------------- */
  function kruegerZeta(Re, rr, rd) {
    Re = Math.max(Re, 2320);
    const ff = (r) => frictionFactor(Re, r);
    const sq = Math.sqrt(rd), arc = Math.PI / 2 * rd;
    if (rr === 0) {
      return Re < 2e5 ? 58.8 / sq * 0.21 / Math.cbrt(Re) + arc * ff(0) : 0.21 / sq + arc * ff(0);
    }
    if (rr < 0.001) {
      const ReK = Math.pow(2.89 / (1 + 1000 * rr), 12);
      if (Re >= 2e5) return 0.21 * (1 + 1000 * rr) / sq + arc * ff(rr);
      if (Re < ReK) return 58.8 / sq * 0.21 / Math.cbrt(Re) + arc * ff(rr);
      return 64 * ff(0) * 0.21 * (1 + 1000 * rr) / sq + arc * ff(rr);
    }
    return Re < 2e5 ? 128 * ff(0) * 0.21 / sq + arc * ff(rr) : 0.42 / sq + arc * ff(rr);
  }
  const MILLER_RW = [0.5, 0.6, 0.7, 0.8, 0.9, 1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5];
  const MILLER_KB = {
    half:   [1.05, 0.75, 0.5, 0.33, 0.26, 0.22, 0.16, 0.155, 0.16, 0.165, 0.17, 0.175, 0.18, 0.19],
    square: [1.1, 0.8, 0.55, 0.35, 0.27, 0.24, 0.16, 0.142, 0.14, 0.142, 0.15, 0.158, 0.17, 0.175],
    two:    [1.1, 0.76, 0.5, 0.35, 0.27, 0.225, 0.125, 0.115, 0.118, 0.123, 0.128, 0.13, 0.135, 0.14],
  };
  function interpLinear(xs, ys, x) {
    if (x <= xs[0]) return ys[0];
    if (x >= xs[xs.length - 1]) return ys[ys.length - 1];
    let i = 1; while (xs[i] < x) i++;
    return ys[i - 1] + (ys[i] - ys[i - 1]) * (x - xs[i - 1]) / (xs[i] - xs[i - 1]);
  }
  function millerKb(aspect, rw) {
    const curve = aspect <= 0.75 ? MILLER_KB.half : aspect <= 1.5 ? MILLER_KB.square : MILLER_KB.two;
    return interpLinear(MILLER_RW, curve, rw);
  }
  /** ζ of a 90° bend at Reynolds number Re (Re based on D_h). */
  function bendZeta(Re, section, radius, relRough) {
    const g = sectionGeom(section);
    if (g.round) return kruegerZeta(Re, relRough, radius / g.W);
    const rw = radius / g.W;
    return kruegerZeta(Re, relRough, rw) + millerKb(g.H / g.W, rw) - kruegerZeta(1e6, 0, rw);
  }
  /** ζ table of a bend over reTable; if zetaRef ≠ 0 the curve is shifted so that ζ(2·10⁵) = zetaRef. */
  function bendZetaTable(p) {
    const shift = p.zetaRef ? p.zetaRef - bendZeta(2e5, p.section, p.radius, p.relRoughness) : 0;
    return p.reTable.map((Re) => shift + bendZeta(Re, p.section, p.radius, p.relRoughness));
  }
  /** ζ table of a Re-dependent component (power law or user table). */
  function zetaReTable(p) {
    if (p.mode === 'powerLaw') return p.reTable.map((Re) => p.zetaRef / Math.pow(Re / 2e5, p.n));
    return p.zetaTable;
  }

  /* ---------------------------------------------------------------------
   * §1.6 Pressure-loss laws  Δp = f(Q)
   * Every law returns {dp, Re, zeta} for a SIGNED flow q (Δp has the sign
   * of q). The solver differentiates f numerically per element (cheap,
   * local); there is no global finite-difference Jacobian.
   * ------------------------------------------------------------------- */
  function zetaLaw(zetaOf, section, fluid) {
    const g = sectionGeom(section);
    return function (q) {
      const v = Math.abs(q) / g.A;
      const Re = v * g.Dh / fluid.nu;
      const zeta = zetaOf(Re);
      return { dp: Math.sign(q) * zeta * fluid.rho / 2 * v * v, Re, zeta, v };
    };
  }
  /* FIX: legacy used the area-equivalent diameter for λ, Re and L/D in
   * rectangular ducts. Now Re, k/D_h and L/D_h use the hydraulic diameter,
   * the velocity uses the real area. */
  function ductLaw(p, fluid) {
    const g = sectionGeom(p.section);
    const rr = (+p.roughness || 0) / g.Dh;
    return function (q) {
      const v = Math.abs(q) / g.A;
      const Re = v * g.Dh / fluid.nu;
      const lambda = frictionFactor(Re, rr);
      const zeta = lambda * p.length / g.Dh;
      return { dp: Math.sign(q) * zeta * fluid.rho / 2 * v * v, Re, zeta, lambda, v };
    };
  }

  /* ---------------------------------------------------------------------
   * §1.7 Component registry
   * Each type declares:
   *   label, ports            port ids; unconnected ports are OPEN to the
   *                           atmosphere (gauge pressure 0)
   *   defaults()              default props
   *   build(c, b, fluid)      adds solver elements via builder b:
   *        b.resist(portOrNode, portOrNode, law, tag)  unknown flow, Δp = f(Q)
   *        b.fixedFlow(a, b, q, tag)                   prescribed flow a→b
   *        b.pressureRise(a, b, tag)                   fan-sizing element
   *        b.constDp(a, b, dp, tag)                    fixed p_a − p_b = dp, unknown flow
   *        b.internal(name)                            hidden internal node
   *   results(c, r, fluid)    → [{key,label,unit,value}] from solution r:
   *        r.p(port) pressure, r.q(tag) flow, r.law(tag)(q) law details
   * To add a component type: add an entry here, a symbol in §4.3 SYMBOLS,
   * a palette entry in §4.3 PALETTE and (if needed) fields in §4.4 FIELDS.
   * ------------------------------------------------------------------- */
  const KINDS = {
    bend: 'Bend 90°', filter: 'Filter', fireDamper: 'Fire damper', smokeDamper: 'Smoke damper',
    soundAbsorber: 'Sound absorber', throttle: 'Throttle valve', custom: 'Custom component',
    duct: 'Straight duct', tee: 'Tee', generic: 'Fan', axial: 'Axial fan', radial: 'Radial fan',
    sizing: 'Fan to be sized', controller: 'Flow controller', fixedDp: 'Fixed Δp',
  };
  const RE_DEFAULT = [2e4, 4e4, 8e4, 2e5, 4e5];
  const roundSec = (d) => ({ shape: 'round', d });

  function flowResults(r, tag, fluid, extra) {
    const q = r.q(tag), info = r.law(tag)(q);
    return [
      { key: 'dp', label: 'Pressure loss', unit: 'Pa', value: r.p('in') - r.p('out') },
      { key: 'ploss', label: 'Hydraulic power loss', unit: 'W', value: (r.p('in') - r.p('out')) * q },
      { key: 'q', label: 'Volume flow', unit: 'm³/h', value: q * 3600 },
      { key: 'v', label: 'Velocity', unit: 'm/s', value: info.v },
      { key: 're', label: 'Reynolds number', unit: '', value: info.Re },
      { key: 'zeta', label: 'ζ (effective)', unit: '', value: info.zeta },
      ...(extra ? extra(info) : []),
      { key: 'pin', label: 'Pressure at inlet', unit: 'Pa', value: r.p('in') },
      { key: 'pout', label: 'Pressure at outlet', unit: 'Pa', value: r.p('out') },
    ];
  }

  const TYPES = {
    duct: {
      label: 'Straight duct', ports: ['in', 'out'],
      defaults: () => ({ length: 1, roughness: 1.5e-4, section: roundSec(0.2) }),
      build(c, b, fluid) { b.resist('in', 'out', ductLaw(c.props, fluid), 'main'); },
      results: (c, r, fluid) => flowResults(r, 'main', fluid, (i) => [{ key: 'lambda', label: 'Friction factor λ', unit: '', value: i.lambda }]),
    },
    zeta: {
      label: 'Fixed ζ', ports: ['in', 'out'],
      defaults: () => ({ zeta: 0.5, section: roundSec(0.2) }),
      build(c, b, fluid) { b.resist('in', 'out', zetaLaw(() => c.props.zeta, c.props.section, fluid), 'main'); },
      results: (c, r, fluid) => flowResults(r, 'main', fluid),
    },
    zetaRe: {
      label: 'Re-dependent ζ', ports: ['in', 'out'],
      defaults: () => ({ mode: 'powerLaw', zetaRef: 0.5, n: 0.1, reTable: RE_DEFAULT.slice(), zetaTable: [0.63, 0.58, 0.55, 0.5, 0.47], section: roundSec(0.2) }),
      build(c, b, fluid) { b.resist('in', 'out', zetaLaw(makeAkima(c.props.reTable, zetaReTable(c.props)), c.props.section, fluid), 'main'); },
      results: (c, r, fluid) => flowResults(r, 'main', fluid),
    },
    bendRe: {
      label: 'Bend 90° (Re-dependent)', ports: ['in', 'out'],
      defaults: () => ({ radius: 0.2, zetaRef: 0, relRoughness: 2e-4, reTable: RE_DEFAULT.slice(), section: roundSec(0.2) }),
      build(c, b, fluid) { b.resist('in', 'out', zetaLaw(makeAkima(c.props.reTable, bendZetaTable(c.props)), c.props.section, fluid), 'main'); },
      results: (c, r, fluid) => flowResults(r, 'main', fluid),
    },
    tee: {
      label: 'Tee', ports: ['in', 'out', 'branch'],
      defaults: () => ({ zetaIn: 1.5, zetaOut: 1.5, zetaBranch: 1.5, sectionIn: roundSec(0.2), sectionOut: roundSec(0.2), sectionBranch: roundSec(0.2) }),
      // legacy topology: in → centre, centre → out, branch → centre, each leg ζ·ρv²/2 with its own velocity
      build(c, b, fluid) {
        const m = b.internal('centre'), p = c.props;
        b.resist('in', m, zetaLaw(() => p.zetaIn, p.sectionIn, fluid), 'in');
        b.resist(m, 'out', zetaLaw(() => p.zetaOut, p.sectionOut, fluid), 'out');
        b.resist('branch', m, zetaLaw(() => p.zetaBranch, p.sectionBranch, fluid), 'branch');
      },
      results(c, r) {
        const qi = r.q('in'), qo = r.q('out'), qb = r.q('branch');
        return [
          { key: 'qin', label: 'Flow in (in → centre)', unit: 'm³/h', value: qi * 3600 },
          { key: 'qout', label: 'Flow out (centre → out)', unit: 'm³/h', value: qo * 3600 },
          { key: 'qbranch', label: 'Flow branch (branch → centre)', unit: 'm³/h', value: qb * 3600 },
          { key: 'vin', label: 'Velocity in', unit: 'm/s', value: r.law('in')(qi).v },
          { key: 'vout', label: 'Velocity out', unit: 'm/s', value: r.law('out')(qo).v },
          { key: 'vbranch', label: 'Velocity branch', unit: 'm/s', value: r.law('branch')(qb).v },
          { key: 'dpio', label: 'Δp in → out', unit: 'Pa', value: r.p('in') - r.p('out') },
          { key: 'dpib', label: 'Δp in → branch', unit: 'Pa', value: r.p('in') - r.p('branch') },
          { key: 'dpbo', label: 'Δp branch → out', unit: 'Pa', value: r.p('branch') - r.p('out') },
          // dissipated power = Σ p_port·(inflow at port); the centre pressure cancels by mass balance
          { key: 'ploss', label: 'Hydraulic power loss', unit: 'W', value: r.p('in') * qi + r.p('branch') * qb - r.p('out') * qo },
          { key: 'pin', label: 'Pressure at in', unit: 'Pa', value: r.p('in') },
          { key: 'pout', label: 'Pressure at out', unit: 'Pa', value: r.p('out') },
          { key: 'pbranch', label: 'Pressure at branch', unit: 'Pa', value: r.p('branch') },
        ];
      },
    },
    fan: {
      label: 'Fan (fixed volume flow)', ports: ['in', 'out'],
      defaults: () => ({ flow: 1000 / 3600 }),
      build(c, b) { b.fixedFlow('in', 'out', +c.props.flow, 'main'); },
      // FIX: legacy reported p_in + p_out; the fan pressure rise is p_out − p_in
      results: (c, r) => [
        { key: 'dpfan', label: 'Fan pressure rise', unit: 'Pa', value: r.p('out') - r.p('in') },
        { key: 'pfan', label: 'Hydraulic power (to air)', unit: 'W', value: (r.p('out') - r.p('in')) * c.props.flow },
        { key: 'q', label: 'Volume flow', unit: 'm³/h', value: c.props.flow * 3600 },
        { key: 'pin', label: 'Pressure at inlet', unit: 'Pa', value: r.p('in') },
        { key: 'pout', label: 'Pressure at outlet', unit: 'Pa', value: r.p('out') },
      ],
    },
    fanSizing: {
      label: 'Fan sizing', ports: ['in', 'out'],
      defaults: () => ({}),
      build(c, b) { b.pressureRise('in', 'out', 'main'); },
      results: (c, r) => [
        { key: 'dpfan', label: 'Required fan pressure', unit: 'Pa', value: r.p('out') - r.p('in') },
        { key: 'pfan', label: 'Hydraulic power (to air)', unit: 'W', value: (r.p('out') - r.p('in')) * r.q('main') },
        { key: 'q', label: 'Volume flow', unit: 'm³/h', value: r.q('main') * 3600 },
        { key: 'pin', label: 'Pressure at inlet', unit: 'Pa', value: r.p('in') },
        { key: 'pout', label: 'Pressure at outlet', unit: 'Pa', value: r.p('out') },
      ],
    },
    /* Fixed pressure change from technical data, independent of the flow:
     * p_out − p_in = dpFixed (negative = pressure loss, positive = pressure rise,
     * e.g. a booster fan with a given Δp). Solver element kind 'const'.
     * Results: effective ζ = (p_in − p_out)/(ρ/2·v²)·sign(Q) at the operating
     * point (negative when the component adds energy to the air). */
    fixedDp: {
      label: 'Fixed pressure change Δp', ports: ['in', 'out'],
      defaults: () => ({ dpFixed: -50, section: roundSec(0.2) }),
      build(c, b) {
        const d = +c.props.dpFixed;
        if (!isFinite(d)) throw new Error('Δp is not a number');
        sectionGeom(c.props.section);
        b.constDp('in', 'out', -d, 'main');
      },
      results(c, r, fluid) {
        const g = sectionGeom(c.props.section), q = r.q('main'), v = Math.abs(q) / g.A, pd = fluid.rho / 2 * v * v;
        const dp = r.p('in') - r.p('out');
        return [
          { key: 'dp', label: 'Pressure loss', unit: 'Pa', value: dp },
          { key: 'ploss', label: 'Hydraulic power loss', unit: 'W', value: dp * q },
          { key: 'q', label: 'Volume flow', unit: 'm³/h', value: q * 3600 },
          { key: 'v', label: 'Velocity', unit: 'm/s', value: v },
          { key: 're', label: 'Reynolds number', unit: '', value: v * g.Dh / fluid.nu },
          // undefined at (almost) zero flow: shown as '–'
          { key: 'zeta', label: 'ζ (effective)', unit: '', value: pd > 1e-9 ? Math.sign(q) * dp / pd : null },
          { key: 'pin', label: 'Pressure at inlet', unit: 'Pa', value: r.p('in') },
          { key: 'pout', label: 'Pressure at outlet', unit: 'Pa', value: r.p('out') },
        ];
      },
    },
    controller: {
      label: 'Flow controller', ports: ['in', 'out'],
      defaults: () => ({ flow: 300 / 3600, zetaOpen: 0, section: roundSec(0.125) }),
      build(c, b) { b.fixedFlow('in', 'out', +c.props.flow, 'main'); },
      results(c, r, fluid) {
        const g = sectionGeom(c.props.section), v = c.props.flow / g.A, pd = fluid.rho / 2 * v * v;
        const dp = r.p('in') - r.p('out');
        return [
          { key: 'dp', label: 'Pressure loss', unit: 'Pa', value: dp },
          { key: 'ploss', label: 'Hydraulic power loss', unit: 'W', value: dp * c.props.flow },
          { key: 'zetaThrottle', label: 'ζ throttling (required)', unit: '', value: dp / pd - c.props.zetaOpen },
          { key: 'dpThrottle', label: 'Throttling pressure', unit: 'Pa', value: dp - c.props.zetaOpen * pd },
          { key: 'q', label: 'Volume flow (set)', unit: 'm³/h', value: c.props.flow * 3600 },
          { key: 'v', label: 'Velocity', unit: 'm/s', value: v },
          { key: 'pin', label: 'Pressure at inlet', unit: 'Pa', value: r.p('in') },
          { key: 'pout', label: 'Pressure at outlet', unit: 'Pa', value: r.p('out') },
        ];
      },
    },
  };

  /* ---------------------------------------------------------------------
   * §1.8 Network assembly
   * Ports joined by connections are merged into one node (union-find), so
   * connections are ideal, loss-free junctions. A port with no connection
   * becomes an OPEN node: pressure = 0 (atmosphere), outflow unknown.
   * Elements: 'resist' (unknown Q, Δp = f(Q)), 'fixed' (known Q),
   * 'rise' (fan sizing: p_out − p_in = Δp_fan, unknown Q),
   * 'const' (fixed Δp: p_a − p_b = e.dp, unknown Q).
   * ------------------------------------------------------------------- */
  function assemble(doc, fluid) {
    const errors = [], warnings = [];
    const comps = doc.components || [];
    const byId = new Map(comps.map((c) => [c.id, c]));
    const parent = new Map();
    const find = (k) => { while (parent.get(k) !== k) { parent.set(k, parent.get(parent.get(k))); k = parent.get(k); } return k; };
    const union = (a, b) => { a = find(a); b = find(b); if (a !== b) parent.set(a, b); };
    for (const c of comps) {
      const T = TYPES[c.type];
      if (!T) { errors.push({ msg: `Unknown component type "${c.type}"`, ids: [c.id] }); continue; }
      for (const p of T.ports) parent.set(c.id + ':' + p, c.id + ':' + p);
    }
    const linked = new Set();
    for (const k of doc.connections || []) {
      const a = k.a.c + ':' + k.a.port, b = k.b.c + ':' + k.b.port;
      if (!parent.has(a) || !parent.has(b)) { warnings.push({ msg: 'A connection refers to a missing port and was ignored.', ids: [] }); continue; }
      if (k.a.c === k.b.c) continue;
      union(a, b); linked.add(a); linked.add(b);
    }
    // nodes
    const nodes = [];           // {key, open, label}
    const nodeOf = new Map();   // root key -> index
    const portNode = (cid, port) => {
      const root = find(cid + ':' + port);
      if (!nodeOf.has(root)) { nodeOf.set(root, nodes.length); nodes.push({ key: root, open: !linked.has(cid + ':' + port), ids: [cid] }); }
      else if (!nodes[nodeOf.get(root)].ids.includes(cid)) nodes[nodeOf.get(root)].ids.push(cid);
      return nodeOf.get(root);
    };
    const elements = [];        // {kind, a, b, law?, q?, cid, tag}
    const compInfo = new Map(); // cid -> {ports:{port:node}, tags:{tag:elementIndex}}
    for (const c of comps) {
      const T = TYPES[c.type];
      if (!T) continue;
      const info = { ports: {}, tags: {} };
      for (const p of T.ports) info.ports[p] = portNode(c.id, p);
      const res = (x) => (typeof x === 'number' ? x : info.ports[x]);
      const b = {
        internal(name) { nodes.push({ key: c.id + '#' + name, open: false, ids: [c.id] }); return nodes.length - 1; },
        resist(x, y, law, tag) { info.tags[tag] = elements.length; elements.push({ kind: 'resist', a: res(x), b: res(y), law, cid: c.id, tag }); },
        fixedFlow(x, y, q, tag) {
          if (!isFinite(q)) throw new Error('volume flow is not a number');
          info.tags[tag] = elements.length; elements.push({ kind: 'fixed', a: res(x), b: res(y), q, cid: c.id, tag });
        },
        pressureRise(x, y, tag) { info.tags[tag] = elements.length; elements.push({ kind: 'rise', a: res(x), b: res(y), cid: c.id, tag }); },
        constDp(x, y, dp, tag) { info.tags[tag] = elements.length; elements.push({ kind: 'const', a: res(x), b: res(y), dp, cid: c.id, tag }); },
      };
      try { T.build(c, b, fluid); }
      catch (e) { errors.push({ msg: `${c.name || KINDS[c.kind] || T.label}: ${e.message}`, ids: [c.id] }); }
      compInfo.set(c.id, info);
      if (T.ports.every((p) => !linked.has(c.id + ':' + p)) && comps.length > 1) {
        warnings.push({ msg: `${c.name || KINDS[c.kind] || T.label} is not connected to anything.`, ids: [c.id] });
      }
    }
    return { nodes, elements, compInfo, errors, warnings };
  }

  /* ---------------------------------------------------------------------
   * §1.9 Sparse symmetric solver: reverse Cuthill–McKee ordering + envelope
   * (skyline) Cholesky. The Newton system is reduced to a weighted graph
   * Laplacian in the node pressures (Schur complement), which is symmetric
   * positive definite once every region has a pressure reference.
   * ------------------------------------------------------------------- */
  function rcmOrder(n, adj) {
    const deg = adj.map((a) => a.length), visited = new Uint8Array(n), order = [];
    const byDeg = [...Array(n).keys()].sort((a, b) => deg[a] - deg[b]);
    for (const start of byDeg) {
      if (visited[start]) continue;
      visited[start] = 1; const queue = [start];
      for (let h = 0; h < queue.length; h++) {
        const v = queue[h]; order.push(v);
        const nb = adj[v].filter((w) => !visited[w]).sort((a, b) => deg[a] - deg[b]);
        for (const w of nb) { visited[w] = 1; queue.push(w); }
      }
    }
    return order.reverse();
  }
  function makeEnvelope(n, pairs) {
    // pairs: list of [i,j] structural off-diagonals (unordered)
    const adj = Array.from({ length: n }, () => []);
    for (const [i, j] of pairs) { adj[i].push(j); adj[j].push(i); }
    const order = rcmOrder(n, adj), pos = new Int32Array(n);
    order.forEach((v, k) => { pos[v] = k; });
    const first = new Int32Array(n);
    for (let k = 0; k < n; k++) first[k] = k;
    for (const [i, j] of pairs) {
      const a = Math.max(pos[i], pos[j]), b = Math.min(pos[i], pos[j]);
      if (b < first[a]) first[a] = b;
    }
    const start = new Int32Array(n + 1);
    for (let k = 0; k < n; k++) start[k + 1] = start[k] + (k - first[k] + 1);
    return { n, pos, first, start, size: start[n] };
  }
  function envCholeskySolve(env, vals, rhs) {
    // vals: Float64Array(env.size), row k holds columns first[k]..k ; factorised in place
    const { n, first, start, pos } = env;
    const at = (k, j) => start[k] + (j - first[k]);
    for (let k = 0; k < n; k++) {
      for (let j = first[k]; j <= k; j++) {
        let s = vals[at(k, j)];
        const lo = Math.max(first[k], first[j]);
        for (let m = lo; m < j; m++) s -= vals[at(k, m)] * vals[at(j, m)];
        if (j < k) vals[at(k, j)] = s / vals[at(j, j)];
        else {
          if (!(s > 0)) return null;
          vals[at(k, k)] = Math.sqrt(s);
        }
      }
    }
    const y = new Float64Array(n);
    for (let i = 0; i < n; i++) y[pos[i]] = rhs[i];
    for (let k = 0; k < n; k++) {
      let s = y[k];
      for (let m = first[k]; m < k; m++) s -= vals[at(k, m)] * y[m];
      y[k] = s / vals[at(k, k)];
    }
    for (let k = n - 1; k >= 0; k--) {
      y[k] /= vals[at(k, k)];
      const yk = y[k];
      for (let m = first[k]; m < k; m++) y[m] -= vals[at(k, m)] * yk;
    }
    const x = new Float64Array(n);
    for (let i = 0; i < n; i++) x[i] = y[pos[i]];
    return x;
  }

  /* ---------------------------------------------------------------------
   * §1.10 Steady-state solver
   * Unknowns: pressures of non-open nodes, flows of 'resist'/'rise' elements.
   * Equations: mass balance per node, Δp-law per element.
   * Method: 4 Picard (secant-conductance) sweeps as warm start, then damped
   * Newton–Raphson with backtracking line search. Element derivatives f'(Q)
   * by local central differences. In the Jacobian only, f'(Q) is floored at
   * EPS_LIN so zero-ζ legs, fan-sizing elements and stagnant branches stay
   * invertible; the residuals use the exact laws, so results are exact.
   * Fan sizing: outer secant loop on Δp_fan so that the most critical flow
   * controller needs exactly zero throttling.
   * ------------------------------------------------------------------- */
  const EPS_LIN = 1e-2;            // Pa per m³/s, Jacobian floor only
  const TOL_Q = 1e-10, TOL_P = 1e-7;

  function solveFixedPoint(net, fanDp, opts) {
    const { nodes, elements } = net;
    const idx = new Int32Array(nodes.length).fill(-1);
    let n = 0;
    nodes.forEach((nd, i) => { if (!nd.open && !nd.pinned) idx[i] = n++; });
    const flowEls = [], fixedEls = [];
    elements.forEach((e) => (e.kind === 'fixed' ? fixedEls : flowEls).push(e));
    const m = flowEls.length;
    const s = new Float64Array(n);                         // known injections
    for (const e of fixedEls) { if (idx[e.a] >= 0) s[idx[e.a]] -= e.q; if (idx[e.b] >= 0) s[idx[e.b]] += e.q; }
    // constant-Δp elements: 'rise' (fan sizing, −Δp_fan) and 'const' (fixed Δp, e.dp); f'(Q) = 0 → EPS_LIN
    const f0 = (e) => (e.kind === 'rise' ? -fanDp : e.kind === 'const' ? e.dp : 0);
    const isConst = (e) => e.kind === 'rise' || e.kind === 'const';
    const f = (e, q) => (isConst(e) ? f0(e) : e.law(q).dp);
    const df = (e, q) => {
      if (isConst(e)) return EPS_LIN;
      const h = 1e-6 * Math.abs(q) + 1e-12;
      return Math.max((e.law(q + h).dp - e.law(q - h).dp) / (2 * h), 0) + EPS_LIN;
    };
    const pairs = [];
    for (const e of flowEls) { const a = idx[e.a], b = idx[e.b]; if (a >= 0 && b >= 0 && a !== b) pairs.push([a, b]); }
    const env = makeEnvelope(n, pairs);
    const p = new Float64Array(n), Q = new Float64Array(m);
    const P = (i) => (idx[i] >= 0 ? p[idx[i]] : 0);

    function assembleSolve(g, rhs) {
      const vals = new Float64Array(env.size), { pos, first, start } = env;
      const add = (i, j, v) => { const a = pos[i], b = pos[j]; const r = Math.max(a, b), c = Math.min(a, b); vals[start[r] + c - first[r]] += v; };
      flowEls.forEach((e, k) => {
        const a = idx[e.a], b = idx[e.b];
        if (a >= 0) add(a, a, g[k]);
        if (b >= 0) add(b, b, g[k]);
        if (a >= 0 && b >= 0 && a !== b) add(a, b, -g[k]);
      });
      return envCholeskySolve(env, vals, rhs);
    }
    function residuals(pv, Qv) {
      const Pv = (i) => (idx[i] >= 0 ? pv[idx[i]] : 0);
      const rm = Float64Array.from(s), re = new Float64Array(m);
      flowEls.forEach((e, k) => {
        if (idx[e.a] >= 0) rm[idx[e.a]] -= Qv[k];
        if (idx[e.b] >= 0) rm[idx[e.b]] += Qv[k];
        re[k] = Pv(e.a) - Pv(e.b) - f(e, Qv[k]);
      });
      return { rm, re };
    }
    // scales for the merit function
    let qScale = 1e-3;
    for (const e of fixedEls) qScale = Math.max(qScale, Math.abs(e.q));
    let pScale = Math.max(10, Math.abs(fanDp));
    for (const e of flowEls) if (e.kind === 'const') pScale = Math.max(pScale, Math.abs(e.dp));
    const merit = ({ rm, re }) => {
      let a = 0; for (const x of rm) a += (x / qScale) ** 2;
      for (const x of re) a += (x / pScale) ** 2; return a;
    };

    // --- Picard warm start: Q_e ≈ (Δp − f0)/k with secant conductance
    if (n > 0 || m > 0) {
      for (let k = 0; k < m; k++) Q[k] = 0.05;
      for (let sweep = 0; sweep < 4; sweep++) {
        const g = new Float64Array(m), rhs = Float64Array.from(s);
        flowEls.forEach((e, k) => {
          const q = Math.max(Math.abs(Q[k]), 1e-6);
          const kk = isConst(e) ? EPS_LIN : Math.max(Math.abs(e.law(q).dp) / q, 0) + EPS_LIN;
          g[k] = 1 / kk;
          if (idx[e.a] >= 0) rhs[idx[e.a]] += f0(e) * g[k];
          if (idx[e.b] >= 0) rhs[idx[e.b]] -= f0(e) * g[k];
        });
        const sol = n ? assembleSolve(g, rhs) : new Float64Array(0);
        if (!sol) return { ok: false, reason: 'singular' };
        p.set(sol);
        flowEls.forEach((e, k) => { Q[k] = (P(e.a) - P(e.b) - f0(e)) * g[k]; });
        pScale = Math.max(pScale, ...Array.from(p, Math.abs));
      }
    }
    // --- Newton
    let res = residuals(p, Q), phi = merit(res), it = 0, converged = false, maxRm = 0, maxRe = 0;
    for (; it < (opts.maxIter || 100); it++) {
      maxRm = 0; maxRe = 0;
      for (const x of res.rm) maxRm = Math.max(maxRm, Math.abs(x));
      for (const x of res.re) maxRe = Math.max(maxRe, Math.abs(x));
      if (maxRm < TOL_Q && maxRe < TOL_P + 1e-10 * pScale) { converged = true; break; }
      const g = new Float64Array(m), rhs = Float64Array.from(res.rm);
      flowEls.forEach((e, k) => {
        g[k] = 1 / df(e, Q[k]);
        const c = g[k] * res.re[k];
        if (idx[e.b] >= 0) rhs[idx[e.b]] += c;
        if (idx[e.a] >= 0) rhs[idx[e.a]] -= c;
      });
      const dp = n ? assembleSolve(g, rhs) : new Float64Array(0);
      if (!dp) return { ok: false, reason: 'singular' };
      const dQ = new Float64Array(m);
      flowEls.forEach((e, k) => {
        const da = idx[e.a] >= 0 ? dp[idx[e.a]] : 0, db = idx[e.b] >= 0 ? dp[idx[e.b]] : 0;
        dQ[k] = g[k] * (da - db + res.re[k]);
      });
      let alpha = 1, accepted = false;
      for (let ls = 0; ls < 30; ls++) {
        const p2 = p.map((x, i) => x + alpha * dp[i]), Q2 = Q.map((x, k) => x + alpha * dQ[k]);
        const r2 = residuals(p2, Q2), phi2 = merit(r2);
        if (phi2 <= (1 - 1e-4 * alpha) * phi || ls === 29) { p.set(p2); Q.set(Q2); res = r2; phi = phi2; accepted = true; break; }
        alpha *= 0.5;
      }
      if (!accepted) break;
      if (opts.onProgress) opts.onProgress({ iteration: it + 1, merit: phi });
    }
    return { ok: converged, reason: converged ? '' : 'not converged', p, Q, idx, flowEls, fixedEls, iterations: it, maxRm, maxRe };
  }

  /** Pressure-reference check: every connected region (through flow elements)
   *  needs an open node; otherwise its fixed flows must balance and one node is pinned. */
  function checkRegions(net) {
    const { nodes, elements } = net;
    const parent = nodes.map((_, i) => i);
    const find = (i) => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
    for (const e of elements) if (e.kind !== 'fixed') parent[find(e.a)] = find(e.b);
    const regions = new Map();
    nodes.forEach((nd, i) => { const r = find(i); if (!regions.has(r)) regions.set(r, { nodes: [], open: false, inj: 0 }); const R = regions.get(r); R.nodes.push(i); if (nd.open) R.open = true; });
    for (const e of elements) if (e.kind === 'fixed') { regions.get(find(e.a)).inj -= e.q; regions.get(find(e.b)).inj += e.q; }
    const errors = [], warnings = [];
    for (const R of regions.values()) {
      if (R.open) continue;
      const ids = [...new Set(R.nodes.flatMap((i) => nodes[i].ids))];
      if (Math.abs(R.inj) > 1e-9) {
        errors.push({ msg: `A closed part of the network (no open port to the atmosphere) receives ${fmt(R.inj * 3600, 1)} m³/h net flow from fans/controllers that cannot leave it.`, ids });
      } else if (R.nodes.length) {
        nodes[R.nodes[0]].pinned = true;
        if (R.nodes.length > 1 || ids.length > 1) warnings.push({ msg: 'A closed part of the network has no open port; its pressure level is undefined and was set to 0 at one point.', ids });
      }

    return { errors, warnings };
  }

  /** Constant-Δp check: elements with a flow-independent Δp ('const' = fixed Δp,
   *  'rise' = fan sizing) must not form a loop on their own. All open ports are
   *  one node here (the atmosphere), so two of them in parallel between a junction
   *  and the atmosphere also form a loop. In such a loop the circulating flow is
   *  undefined (equal Δp) or no solution exists (Σ Δp ≠ 0); the Jacobian floor
   *  EPS_LIN would hide this and return an arbitrary split. Loops that contain a
   *  resist or fixed-flow element are fine. */
  function checkConstLoops(net, nameOf) {
    const { nodes, elements } = net, GROUND = nodes.length;
    const nodeOf = (i) => (nodes[i].open ? GROUND : i);
    const parent = Array.from({ length: nodes.length + 1 }, (_, i) => i);
    const find = (i) => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
    const adj = new Map(), link = (a, b, e) => { if (!adj.has(a)) adj.set(a, []); adj.get(a).push([b, e]); };
    const errors = [];
    for (const e of elements) {
      if (e.kind !== 'const' && e.kind !== 'rise') continue;
      const a = nodeOf(e.a), b = nodeOf(e.b);
      if (find(a) !== find(b)) { parent[find(a)] = find(b); link(a, b, e); link(b, a, e); continue; }
      // loop closed by e: path a → b through the constant elements found so far
      const prev = new Map([[a, null]]), queue = [a];
      for (let k = 0; k < queue.length && !prev.has(b); k++) for (const [w, el] of adj.get(queue[k]) || []) if (!prev.has(w)) { prev.set(w, [queue[k], el]); queue.push(w); }
      const loop = [e];
      for (let v = b; prev.get(v); v = prev.get(v)[0]) loop.push(prev.get(v)[1]);
      const ids = [...new Set(loop.map((x) => x.cid))], names = ids.map(nameOf);
      errors.push({ msg: loop.length === 1
        ? `${names[0]}: both ports are open (or joined), so its fixed Δp would act between two points of equal pressure. Connect it in the network.`
        : `${names.join(', ')} form a loop of fixed pressure differences only (open ports count as one point, the atmosphere). The flow in this loop is undefined. Add a flow-dependent component (duct, ζ fitting) to one of the paths.`, ids });
    }
    return { errors };
  }

  /** Main entry: calculate a project document. Returns a serialisable result. */
  function calculate(doc, opts = {}) {
    const t0 = (typeof performance !== 'undefined' ? performance : Date).now();
    const out = { ok: false, calcModelVersion: CALC_MODEL_VERSION, errors: [], warnings: [], components: {}, nodes: [], stats: {} };
    let fluid;
    try { fluid = resolveFluid(doc.fluid); } catch (e) { out.errors.push({ msg: e.message, ids: [] }); return out; }
    out.fluid = fluid;
    const net = assemble(doc, fluid);
    out.errors.push(...net.errors); out.warnings.push(...net.warnings);
    if (out.errors.length) return out;
    if (!net.elements.length) { out.errors.push({ msg: 'The network is empty. Add components from the palette.', ids: [] }); return out; }
    const reg = checkRegions(net);
    out.errors.push(...reg.errors); out.warnings.push(...reg.warnings);
    const byId = new Map((doc.components || []).map((c) => [c.id, c]));
    out.errors.push(...checkConstLoops(net, (id) => { const c = byId.get(id); return c ? (c.name || KINDS[c.kind] || TYPES[c.type].label) + ` (${id})` : id; }).errors);
    if (out.errors.length) return out;

    const sizing = net.elements.filter((e) => e.kind === 'rise');
    const controllers = (doc.components || []).filter((c) => c.type === 'controller');
    const ctrlInfo = controllers.map((c) => {
      const g = sectionGeom(c.props.section), v = c.props.flow / g.A;
      return { c, info: net.compInfo.get(c.id), dpOpen: c.props.zetaOpen * fluid.rho / 2 * v * v };
    });
    const pressureAt = (sol, node) => (sol.idx[node] >= 0 ? sol.p[sol.idx[node]] : 0);
    const slack = (sol) => Math.min(...ctrlInfo.map(({ info, dpOpen }) => pressureAt(sol, info.ports.in) - pressureAt(sol, info.ports.out) - dpOpen));

    let fanDp = 0, sol = solveFixedPoint(net, fanDp, opts), outer = 0;
    if (sol.ok && sizing.length) {
      if (sizing.length > 1) out.warnings.push({ msg: 'More than one "fan sizing" component: all get the same pressure rise.', ids: sizing.map((e) => e.cid) });
      if (!ctrlInfo.length) out.warnings.push({ msg: 'Fan sizing needs at least one flow controller that sets the volume flow. Without one the required pressure is 0.', ids: sizing.map((e) => e.cid) });
      else {
        // secant iteration on Δp_fan: slack(Δp) = 0 (exactly linear when all flows are prescribed)
        let x0 = 0, y0 = slack(sol), x1 = -y0, y1;
        for (outer = 1; outer <= 12; outer++) {
          sol = solveFixedPoint(net, x1, opts);
          if (!sol.ok) break;
          y1 = slack(sol);
          if (Math.abs(y1) < 1e-6 * Math.max(1, Math.abs(x1))) break;
          const x2 = y1 === y0 ? x1 - y1 : x1 - y1 * (x1 - x0) / (y1 - y0);
          x0 = x1; y0 = y1; x1 = x2;
        }
        fanDp = x1;
      }
    }
    const t1 = (typeof performance !== 'undefined' ? performance : Date).now();
    out.stats = { ms: t1 - t0, iterations: sol.iterations, outerIterations: outer, unknowns: (sol.p ? sol.p.length : 0) + (sol.Q ? sol.Q.length : 0), maxMassResidual: sol.maxRm, maxPressureResidual: sol.maxRe };
    if (!sol.ok) {
      out.errors.push({ msg: sol.reason === 'singular'
        ? 'The equation system is singular. Check for parts of the network that are not connected to a fan or to the atmosphere.'
        : `The solver did not converge (max. residuals ${sol.maxRm?.toExponential(1)} m³/s, ${sol.maxRe?.toExponential(1)} Pa).`, ids: [] });
      return out;
    }
    // --- per-component results
    const Qof = new Map(); sol.flowEls.forEach((e, k) => Qof.set(e, sol.Q[k]));
    out.nodes = net.nodes.map((nd, i) => ({ key: nd.key, p: pressureAt(sol, i), open: nd.open }));
    for (const c of doc.components || []) {
      const info = net.compInfo.get(c.id); if (!info) continue;
      const el = (tag) => net.elements[info.tags[tag]];
      const r = {
        p: (port) => pressureAt(sol, info.ports[port]),
        q: (tag) => { const e = el(tag); return e.kind === 'fixed' ? e.q : Qof.get(e); },
        law: (tag) => el(tag).law,
      };
      try {
        const values = TYPES[c.type].results(c, r, fluid);
        const portP = {}; for (const pt of TYPES[c.type].ports) portP[pt] = r.p(pt);
        out.components[c.id] = { values, portP };
        // reverse flow hint for two-port flow components
        const nm = c.name || KINDS[c.kind] || c.type;
        if (info.tags.main !== undefined && el('main').kind === 'resist' && r.q('main') < -1e-6) {
          out.warnings.push({ msg: `${nm}: air flows from outlet to inlet (${fmt(r.q('main') * 3600, 1)} m³/h).`, ids: [c.id] });
        }
        // fixed Δp: the Δp is held whatever the flow, which is only physical for forward flow
        if (c.type === 'fixedDp') {
          const q = r.q('main'), d = +c.props.dpFixed;
          if (Math.abs(q) <= 1e-6 && d !== 0) out.warnings.push({ msg: `${nm}: (almost) no flow, but its fixed Δp of ${fmt(d, 1)} Pa is still applied; effective ζ undefined.`, ids: [c.id] });
          else if (q < -1e-6) out.warnings.push({ msg: `${nm}: air flows from outlet to inlet (${fmt(q * 3600, 1)} m³/h)` + (d < 0 ? `; the fixed pressure loss then acts like a fan and adds ${fmt(Math.abs(d * q), 1)} W to the air. Check Δp and the flow direction.` : '; the pressure rise works against the flow.'), ids: [c.id] });
        }
      } catch (e) { out.warnings.push({ msg: `Results of ${c.name || c.type}: ${e.message}`, ids: [c.id] }); }
    }
    for (const { c, info, dpOpen } of ctrlInfo) {
      const throttle = pressureAt(sol, info.ports.in) - pressureAt(sol, info.ports.out) - dpOpen;
      if (throttle < -1e-3) out.warnings.push({ msg: `Controller ${c.name || ''} lacks ${fmt(-throttle, 1)} Pa to deliver its set flow.`, ids: [c.id] });
    }
    // open ports: outflow to atmosphere
    out.fanDp = sizing.length ? fanDp : null;
    out.ok = true;
    return out;
  }

  /* ---------------------------------------------------------------------
   * §1.11 ζ models of a component (unified "ζ model" switch in the UI)
   * The file format keeps three types; the UI presents them as models:
   *   fixed       → type 'zeta'
   *   powerLaw    → type 'zetaRe', props.mode 'powerLaw'
   *   table       → type 'zetaRe', props.mode 'table'
   *   correlation → type 'bendRe'   (bends only: Krüger/Miller)
   * switchModel() converts a component between models. Settings of models that
   * are not active are kept in props.stash[type] and restored when switching
   * back. Without stored settings the conversion keeps the pressure loss:
   *   → fixed:       ζ at the operating point (opts.zetaOp, from fresh results),
   *                  else ζ at Re = 2·10⁵
   *   → power law:   from fixed ζref = ζ, n = 0; from a curve: n from a log-log
   *                  fit, ζref so that ζ at the operating point is kept
   *   → table:       the current curve at the same Re points (fixed: constant)
   *   → correlation: Krüger/Miller, shifted so that ζ at the operating point
   *                  (else at Re = 2·10⁵) is kept; radius = section width
   *                  (R/W = 1): check it
   * opts: {zetaOp, reOp} = effective ζ and Re at the operating point from fresh
   * results (both optional).
   * The calculation itself is unchanged; stash is ignored by the solver.
   * ------------------------------------------------------------------- */
  const ZETA_MODEL_TYPES = new Set(['zeta', 'zetaRe', 'bendRe']);
  const MODEL_LABELS = { fixed: 'Fixed ζ', powerLaw: 'Re-dependent ζ, power law', table: 'Re-dependent ζ, table', correlation: 'Re-dependent ζ, bend correlation' };
  const modelOf = (c) => (c.type === 'zeta' ? 'fixed' : c.type === 'bendRe' ? 'correlation' : c.type === 'zetaRe' ? (c.props.mode === 'table' ? 'table' : 'powerLaw') : null);
  const modelsFor = (c) => (!ZETA_MODEL_TYPES.has(c.type) ? [] : c.kind === 'bend' ? ['fixed', 'correlation', 'powerLaw', 'table'] : ['fixed', 'powerLaw', 'table']);
  const modelLabel = (c) => MODEL_LABELS[modelOf(c)] || TYPES[c.type].label;
  /** ζ(Re) curve of a Re-dependent component as {reTable, zetaTable}; null for fixed ζ. */
  function zetaCurve(c) {
    if (c.type === 'zetaRe') return { reTable: c.props.reTable.slice(), zetaTable: zetaReTable(c.props).slice() };
    if (c.type === 'bendRe') return { reTable: c.props.reTable.slice(), zetaTable: bendZetaTable(c.props) };
    return null;
  }
  function zetaAt(c, Re) { const cv = zetaCurve(c); return cv ? makeAkima(cv.reTable, cv.zetaTable)(Re) : +c.props.zeta; }
  const r5 = (x) => +(+x).toPrecision(5);
  function switchModel(c, target, opts = {}) {
    const cur = modelOf(c);
    if (!cur || cur === target || !modelsFor(c).includes(target)) return { c, note: '' };
    const { stash: oldStash, ...curProps } = c.props;
    const stash = Object.assign({}, oldStash, { [c.type]: curProps });
    const section = curProps.section;
    const type = target === 'fixed' ? 'zeta' : target === 'correlation' ? 'bendRe' : 'zetaRe';
    const curve = zetaCurve(c), z2e5 = zetaAt(c, 2e5);
    const hasOp = opts.zetaOp !== undefined && isFinite(opts.zetaOp) && opts.reOp > 0;
    let props, note = '';
    if (type === c.type) {                                   // power law <-> table inside 'zetaRe'
      props = Object.assign({}, curProps, { mode: target });
      if (target === 'table') props.zetaTable = zetaReTable(curProps).map(r5);
    } else if (stash[type]) {                                // restore the remembered settings
      props = Object.assign({}, stash[type], { section });
      if (type === 'zetaRe') {
        if (target === 'table' && props.mode !== 'table') props.zetaTable = zetaReTable(props).map(r5);
        props.mode = target;
      }
      note = `Restored the previous ${MODEL_LABELS[target]} settings.`;
    } else if (target === 'fixed') {
      const z = opts.zetaOp !== undefined && isFinite(opts.zetaOp) ? opts.zetaOp : z2e5;
      props = { zeta: r5(z), section };
      note = opts.zetaOp !== undefined && isFinite(opts.zetaOp) ? `ζ = ${fmt(z, 3)} taken from the current operating point.` : `ζ = ${fmt(z, 3)} taken at Re = 2·10⁵ (no current results).`;
    } else if (target === 'powerLaw') {
      let zetaRef = curve ? z2e5 : +curProps.zeta, n = 0;
      if (curve && curve.zetaTable.every((z) => z > 0) && curve.reTable.length >= 2) {      // least squares in log-log
        const xs = curve.reTable.map((r) => Math.log(r / 2e5)), ys = curve.zetaTable.map(Math.log);
        const mx = xs.reduce((a, b) => a + b) / xs.length, my = ys.reduce((a, b) => a + b) / ys.length;
        const sxy = xs.reduce((a, x, i) => a + (x - mx) * (ys[i] - my), 0), sxx = xs.reduce((a, x) => a + (x - mx) ** 2, 0);
        n = sxx > 0 ? -sxy / sxx : 0; zetaRef = Math.exp(my + n * mx);
        if (hasOp) zetaRef = opts.zetaOp * Math.pow(opts.reOp / 2e5, n);
        note = hasOp ? 'Power law fitted to the previous ζ(Re) curve, matching the current operating point.' : 'Power law fitted to the previous ζ(Re) curve.';
      }
      const reTable = curve ? curve.reTable : RE_DEFAULT.slice();
      props = { mode: 'powerLaw', zetaRef: r5(zetaRef), n: r5(n), reTable, zetaTable: reTable.map(() => r5(zetaRef)), section };
    } else if (target === 'table') {
      const reTable = curve ? curve.reTable : RE_DEFAULT.slice();
      props = { mode: 'table', zetaRef: r5(z2e5), n: 0, reTable, zetaTable: curve ? curve.zetaTable.map(r5) : reTable.map(() => r5(curProps.zeta)), section };
    } else {                                                 // correlation (bends)
      const g = sectionGeom(section);
      props = { radius: r5(g.W), zetaRef: 0, relRoughness: 2e-4, reTable: curve ? curve.reTable : RE_DEFAULT.slice(), section };
      const [reK, zK] = hasOp ? [opts.reOp, opts.zetaOp] : [2e5, z2e5];       // keep ζ at this point
      const raw = makeAkima(props.reTable, bendZetaTable(props))(reK);         // unshifted correlation (zetaRef 0 = no shift)
      props.zetaRef = r5(zK - raw + bendZeta(2e5, section, props.radius, props.relRoughness));
      note = `Bend correlation shifted to keep ζ at ${hasOp ? 'the current operating point' : 'Re = 2·10⁵'}. Check the bend radius (set to R/W = 1).`;
    }
    delete stash[type];
    if (Object.keys(stash).length) props.stash = stash;
    return { c: Object.assign({}, c, { type, props }), note };
  }

  /* §1.12 small helpers shared with the UI */
  function fmt(x, digits = 2) {
    if (x === null || x === undefined || !isFinite(x)) return '–';
    return Number(x).toLocaleString('en-US', { maximumFractionDigits: digits, minimumFractionDigits: 0 });
  }
  function newComponent(type, kind, x, y, id) {
    const T = TYPES[type];
    return { id, type, kind: kind || type, name: '', x, y, rotation: 0, props: T.defaults() };
  }

  root.LukaCore = {
    CALC_MODEL_VERSION, TYPES, KINDS, RE_DEFAULT,
    airProperties, resolveFluid, sectionGeom, sectionLabel, frictionFactor, makeAkima,
    kruegerZeta, millerKb, bendZeta, bendZetaTable, zetaReTable, ductLaw, zetaLaw,
    MODEL_LABELS, modelOf, modelsFor, modelLabel, zetaCurve, zetaAt, switchModel,
    assemble, calculate, newComponent, fmt,
  };
})(typeof globalThis !== 'undefined' ? globalThis : self);
</script>
<script id="luka-io">
/* ===========================================================================
 * §2 IO  —  project documents, Excel export, file helpers
 * ---------------------------------------------------------------------------
 * Project document (JSON, saved as *.luka.json), format version 1:
 * {
 *   "format": "luka-project", "version": 1, "calcModelVersion": 2,
 *   "name": "Office supply",
 *   "fluid": {"mode": "air", "temperatureC": 20, "pressurePa": 101325}
 *         |  {"mode": "custom", "density": 1.2, "kinViscosity": 1.5e-5},
 *   "components": [{"id": "c1", "type": "duct", "kind": "duct", "name": "",
 *                   "x": 120, "y": 80,          // centre of the symbol, canvas px
 *                   "rotation": 0,              // 0 | 90 | 180 | 270 (display only)
 *                   "props": {...}}],           // see LukaCore.TYPES[type].defaults()
 *   "connections": [{"id": "k1", "a": {"c": "c1", "port": "out"},

      return [steps.every((x) => near(x, dp0, 1e-9)) && back.type === 'zeta' && back.props.zeta === 0.8 && !back.props.stash?.zeta, `Δp ${dp0} → ${steps.join(', ')}`];
    }],
    ['ζ model switch keeps Δp at the operating point (fixed → correlation → power law)', () => {
      const s = { shape: 'round', d: 0.2 };
      const d = net([['f', 'fan', { flow: 0.1 }], ['z', 'zeta', { zeta: 0.4, section: s }]], [['f', 'out', 'z', 'in']]);
      d.components[1].kind = 'bend';
      const dp0 = val(C.calculate(d), 'z', 'dp'), steps = [];
      for (const m of ['correlation', 'powerLaw']) {
        const v = C.calculate(d).components.z.values, op = { zetaOp: v.find((x) => x.key === 'zeta').value, reOp: v.find((x) => x.key === 're').value };
        d.components[1] = C.switchModel(d.components[1], m, op).c; steps.push(val(C.calculate(d), 'z', 'dp'));
      }
      return [steps.every((x) => near(x, dp0, 2e-3)), `Δp ${dp0.toFixed(4)} → ${steps.map((x) => x.toFixed(4)).join(', ')}`];
    }],
    ['ζ model switch: bend correlation → table reproduces the curve exactly', () => {
      const b = C.newComponent('bendRe', 'bend', 0, 0, 'b'); b.props.section = { shape: 'rect', w: 0.4, h: 0.2 }; b.props.radius = 0.3;
      const t = C.switchModel(b, 'table').c, back = C.switchModel(t, 'correlation').c;
      const ok = t.type === 'zetaRe' && t.props.mode === 'table' && [3e4, 1e5, 3e5].every((re) => near(C.zetaAt(t, re), C.zetaAt(b, re), 1e-4))
        && back.type === 'bendRe' && back.props.radius === 0.3;
      return [ok, `ζ(1e5): ${C.zetaAt(b, 1e5)} vs ${C.zetaAt(t, 1e5)}`];
    }],
    ['fixed Δp: series loss by hand, effective ζ = Δp/(ρ/2·v²)', () => {
      const s = { shape: 'round', d: 0.2 }, fl = C.airProperties(20, 101325), v = 0.2 / (Math.PI * 0.01);
      const d = net([['f', 'fan', { flow: 0.2 }], ['z', 'zeta', { zeta: 1.5, section: s }], ['x', 'fixedDp', { dpFixed: -80, section: s }]], [['f', 'out', 'z', 'in'], ['z', 'out', 'x', 'in']]);
      const r = C.calculate(d), pd = fl.rho / 2 * v * v;
      return [r.ok && near(val(r, 'f', 'dpfan'), 80 + 1.5 * pd, 1e-9) && near(val(r, 'x', 'dp'), 80, 1e-9) && near(val(r, 'x', 'zeta'), 80 / pd, 1e-9),
        `fan ${val(r, 'f', 'dpfan')} Pa, ζeff ${val(r, 'x', 'zeta')}`];
    }],
    ['fixed Δp in parallel with ζ: hand split; booster drives flow; energy balance', () => {
      const s = { shape: 'round', d: 0.2 }, fl = C.airProperties(20, 101325), A = Math.PI * 0.01;
      const d = net([['f', 'fan', { flow: 0.2 }], ['a', 'zeta', { zeta: 2, section: s }], ['x', 'fixedDp', { dpFixed: -20, section: s }]], [['f', 'out', 'a', 'in'], ['f', 'out', 'x', 'in']]);
      const r = C.calculate(d), qa = Math.sqrt(20 / (2 * fl.rho / 2)) * A;      // ζ branch carries Δp = 20 Pa
      const b = net([['d1', 'duct', { length: 10, section: s }], ['x', 'fixedDp', { dpFixed: 300, section: s }], ['d2', 'duct', { length: 10, section: s }]], [['d1', 'out', 'x', 'in'], ['x', 'out', 'd2', 'in']]);
      const rb = C.calculate(b), bal = val(rb, 'd1', 'ploss') + val(rb, 'd2', 'ploss') + val(rb, 'x', 'ploss');
      return [r.ok && near(val(r, 'a', 'q') / 3600, qa, 1e-8) && near(val(r, 'x', 'q') / 3600, 0.2 - qa, 1e-8) && rb.ok && near(val(rb, 'd1', 'dp'), 150, 1e-8) && Math.abs(bal) < 1e-8,
        `q_ζ ${val(r, 'a', 'q')} m³/h, booster flow ${val(rb, 'x', 'q')} m³/h, Σ power ${bal} W`];
    }],
    ['fixed Δp replacing a ζ at its operating point reproduces the network', () => {
      const s = { shape: 'round', d: 0.2 }, sb = { shape: 'round', d: 0.16 };
      const parts = [['f', 'fan', { flow: 0.25 }], ['t', 'tee', { zetaIn: 0.3, zetaOut: 0.2, zetaBranch: 1.1, sectionIn: s, sectionOut: s, sectionBranch: sb }],
        ['a', 'zeta', { zeta: 2, section: s }], ['b', 'zetaRe', { section: sb }], ['d', 'duct', { length: 4, section: sb }]];
      const conns = [['f', 'out', 't', 'in'], ['t', 'out', 'a', 'in'], ['t', 'branch', 'b', 'in'], ['b', 'out', 'd', 'in']];
      const r0 = C.calculate(net(parts, conns));
      const parts2 = parts.map((x) => (x[0] === 'b' ? ['b', 'fixedDp', { dpFixed: -val(r0, 'b', 'dp'), section: sb }] : x));
      const r1 = C.calculate(net(parts2, conns));
      return [r1.ok && near(val(r1, 'a', 'q'), val(r0, 'a', 'q'), 1e-7) && near(val(r1, 'b', 'zeta'), val(r0, 'b', 'zeta'), 1e-6), `q ${val(r0, 'a', 'q')} → ${val(r1, 'a', 'q')} m³/h`];
    }],
    ['fixed Δp: loops of fixed Δp only (also via open ports) are reported', () => {
      const s = { shape: 'round', d: 0.2 };
      const two = net([['f', 'fan', { flow: 0.2 }], ['x', 'fixedDp', { dpFixed: -50, section: s }], ['y', 'fixedDp', { dpFixed: -50, section: s }]], [['f', 'out', 'x', 'in'], ['f', 'out', 'y', 'in']]);
      const lone = net([['f', 'fan', { flow: 0.2 }], ['d', 'duct', { section: s }], ['x', 'fixedDp', { section: s }]], [['f', 'out', 'd', 'in']]);
      const r1 = C.calculate(two), r2 = C.calculate(lone);
      return [!r1.ok && r1.errors[0]?.ids.length === 2 && !r2.ok && r2.errors[0]?.ids[0] === 'x', `${r1.errors[0]?.msg} | ${r2.errors[0]?.msg}`];
    }],
    ['xlsx writer produces a valid ZIP (CRC32 check value)', () => {
      const crc = IO.crc32(new TextEncoder().encode('123456789'));
      const z = IO.makeXlsx([{ name: 'S', rows: [['a', 1]] }]);
      return [crc === 0xCBF43926 && z[0] === 0x50 && z[1] === 0x4b, crc.toString(16)];
    }],
  ];

  function runTests() {
    return TESTS.map(([name, fn]) => {
      try { const [ok, detail] = fn(); return { name, ok: !!ok, detail }; }
      catch (e) { return { name, ok: false, detail: e.message }; }
    });
  }
  root.LukaTests = { runTests };
