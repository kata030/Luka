<script id="luka-pip2json" type="text/x-python">
#!/usr/bin/env python3
"""
pip2json.py - convert legacy HRI-Luka project files (.pip, Python pickle) into
the JSON project format of the browser version (luka.html, format version 1).

Usage:
    python3 pip2json.py project.pip [more.pip ...]      -> writes project.luka.json next to each input

Requirements: Python 3.9+, Pillow (only if the project contains a background image).
The script must NOT be run on untrusted files: unpickling executes code.
It does not need the legacy Luka source tree; unknown classes are stubbed.

Mapping (legacy GUI class -> new component type/kind):
    Duct                                  -> duct
    Arch, Filter, FireDamper, SmokeDamper,
    SoundAbsorber, ThrottleValve,
    Component_fixed                       -> zeta        (kind: bend, filter, ...)
    *Spline (except ArchSpline),
    Component_variable                    -> zetaRe      (kind: filter, ...)
    ArchSpline                            -> bendRe
    PipeTee                               -> tee
    Ventilator, AxialFan, CentrifugalFan  -> fan         (kind: generic, axial, radial)
    ChooseFan                             -> fanSizing
    Controller                            -> controller
"""
import base64
import io
import json
import pickle
import sys
import uuid
from pathlib import Path

KIND = {
    "Arch": ("zeta", "bend"), "Filter": ("zeta", "filter"), "FireDamper": ("zeta", "fireDamper"),
    "SmokeDamper": ("zeta", "smokeDamper"), "SoundAbsorber": ("zeta", "soundAbsorber"),
    "ThrottleValve": ("zeta", "throttle"), "Component_fixed": ("zeta", "custom"),
    "FilterSpline": ("zetaRe", "filter"), "FireDamperSpline": ("zetaRe", "fireDamper"),
    "SmokeDamperSpline": ("zetaRe", "smokeDamper"), "SoundAbsorberSpline": ("zetaRe", "soundAbsorber"),
    "ThrottleValveSpline": ("zetaRe", "throttle"), "Component_variable": ("zetaRe", "custom"),
    "ArchSpline": ("bendRe", "bend"), "Duct": ("duct", "duct"), "PipeTee": ("tee", "tee"),
    "Ventilator": ("fan", "generic"), "AxialFan": ("fan", "axial"), "CentrifugalFan": ("fan", "radial"),
    "ChooseFan": ("fanSizing", "sizing"), "Controller": ("controller", "controller"),
}
PORTS = {"inlet": "in", "outlet": "out", "branch": "branch", "node": "in"}


class _Stub:
    """Stand-in for legacy classes (flow_graph.Variable etc.) so no legacy code is needed."""
    def __setstate__(self, state):
        self.__dict__.update(state if isinstance(state, dict) else {"_state": state})


class _Unpickler(pickle.Unpickler):
    def find_class(self, module, name):
        if module in ("uuid",) or module.startswith(("PIL", "numpy", "builtins", "copyreg", "collections")):
            return super().find_class(module, name)
        return type(name, (_Stub,), {})


def num(v):
    """Legacy values may be numpy scalars or flow_graph.Variable objects."""
    if hasattr(v, "value"):
        v = v.value
    try:
        return float(v)
    except (TypeError, ValueError):
        return None


def section(p, suffix=""):
    w, h = num(p.get("width" + suffix, 0)) or 0, num(p.get("height" + suffix, 0)) or 0
    if w * h != 0:
        return {"shape": "rect", "w": w, "h": h}
    d = num(p.get("diameter" + suffix)) or num(p.get("diameter_h" + suffix)) or 0.2
    return {"shape": "round", "d": d}


def convert_props(cls, p):
    t, kind = KIND[cls]
    if t == "duct":
        return {"length": num(p["length"]), "roughness": num(p["roughness"]), "section": section(p)}
    if t == "zeta":
        return {"zeta": num(p["zeta"]), "section": section(p)}
    if t == "zetaRe":
        re_t = [float(x) for x in p["reynold_spline_values"]]
        ze_t = [float(x) for x in p["zeta_spline_values"]]
        z_ref, n = num(p.get("zeta_Re_2e5", 0)) or 0, num(p.get("reynold_correction", 0)) or 0
        # legacy GUI regenerated the table from the power law when zeta_Re_2e5 != 0;
        # keep power-law mode only if the stored table is consistent with it
        consistent = z_ref != 0 and all(abs(z - z_ref / (r / 2e5) ** n) < 1e-6 * max(1, abs(z)) for r, z in zip(re_t, ze_t))
        return {"mode": "powerLaw" if consistent else "table", "zetaRef": z_ref, "n": n,
                "reTable": re_t, "zetaTable": ze_t, "section": section(p)}
    if t == "bendRe":
        return {"radius": num(p["radius"]), "zetaRef": num(p.get("zeta_Re2e5", 0)) or 0, "relRoughness": 2e-4,
                "reTable": [float(x) for x in p["reynold_spline_values"]], "section": section(p)}
    if t == "tee":
        return {"zetaIn": num(p["zeta_in"]), "zetaOut": num(p["zeta_out"]), "zetaBranch": num(p["zeta_branch"]),
                "sectionIn": section(p, "_in"), "sectionOut": section(p, "_out"), "sectionBranch": section(p, "_branch")}
    if t == "fan":
        return {"flow": num(p["volume_flow"])}
    if t == "fanSizing":
        return {}
    if t == "controller":
        # legacy 'zeta' was overwritten by the solver on every run -> not an input; open loss defaults to 0
        return {"flow": num(p["volume_flow"]), "zetaOpen": 0.0, "section": section(p)}
    raise ValueError(cls)


def convert(path):
    with open(path, "rb") as f:
        data = _Unpickler(f).load()
    comps, node_owner = [], {}
    for i, (cls, pos, props, nodes) in enumerate(data["components"]):
        if cls not in KIND:
            print(f"  skipping unknown component class {cls}", file=sys.stderr)
            continue
        t, kind = KIND[cls]
        cid = f"c{i + 1}"
        comps.append({"id": cid, "type": t, "kind": kind, "name": str(props.get("name", "") or ""),
                      "x": float(pos[0]), "y": float(pos[1]), "rotation": 0, "props": convert_props(cls, props)})
        for port_key, node_id in nodes.items():
            node_owner[node_id] = (cid, PORTS.get(port_key, port_key))
    conns, seen = [], set()
    for a, b in data["edges"]:
        if a in node_owner and b in node_owner and node_owner[a][0] != node_owner[b][0]:
            key = tuple(sorted([node_owner[a], node_owner[b]]))
            if key in seen:
                continue
            seen.add(key)
            conns.append({"id": f"k{len(conns) + 1}", "a": {"c": node_owner[a][0], "port": node_owner[a][1]},
                          "b": {"c": node_owner[b][0], "port": node_owner[b][1]}})
    bg = None
    if "background" in data:
        img, (w, h) = data["background"]["image"], data["background"]["size"]
        buf = io.BytesIO()
        if not hasattr(img, "filename"):
            img.filename = ""  # attribute is missing on unpickled PIL images
        img.save(buf, format="PNG")
        # legacy: component positions are relative to the centre of the background image
        bg = {"dataUrl": "data:image/png;base64," + base64.b64encode(buf.getvalue()).decode(),
              "x": -w / 2, "y": -h / 2, "width": float(w), "height": float(h), "opacity": 0.7, "locked": True}
    return {"format": "luka-project", "version": 1, "calcModelVersion": 2, "name": Path(path).stem,
            "fluid": {"mode": "air", "temperatureC": 20, "pressurePa": 101325},
            "components": comps, "connections": conns, "background": bg}


if __name__ == "__main__":
    if len(sys.argv) < 2:
        print(__doc__)
        sys.exit(1)
    for p in sys.argv[1:]:
        out = Path(p).with_suffix(".luka.json")
        out.write_text(json.dumps(convert(p), indent=1, ensure_ascii=False))
        print(f"{p} -> {out}")
</script>
<script id="luka-ui">
if (window.React && window.ReactFlow && window.htm) {
/* ===========================================================================
 * §4 UI  —  React 18 + React Flow 12, written with htm (no build step)
 * ---------------------------------------------------------------------------
 * html`<${Comp} prop=${x}/>` is htm's JSX replacement. Use className, and
 * camelCase SVG attributes (strokeWidth), exactly like JSX.
 * State lives in ONE store (§4.1). The project document `doc` is the single
 * source of truth; React Flow runs in controlled mode and its nodes/edges
 * are derived from `doc` in §4.5. Every user edit goes through commit().
 * ======================================================================== */
(function () {
  'use strict';
  const { useState, useEffect, useMemo, useCallback, useRef, useSyncExternalStore } = React;
  const RF = window.ReactFlow;
  const html = htm.bind(React.createElement);
  const C = window.LukaCore, IO = window.LukaIO;
  const NODE = 52;              // symbol box size in canvas px (component x/y = box centre)
  const BG_ID = '__background';
  const AUTOSAVE_KEY = 'luka-web.autosave.v1';
  const THEME_KEY = 'luka-web.theme.v1';    // 'light' | 'dark'; absent = automatic (follow the system)

  /* Appearance: 'auto' follows prefers-color-scheme; 'light'/'dark' set <html data-theme>, which the
   * CSS tokens in §5 honour. Applied before the first render to avoid a flash of the wrong theme. */
  function readTheme() { try { const t = localStorage.getItem(THEME_KEY); return t === 'light' || t === 'dark' ? t : 'auto'; } catch (e) { return 'auto'; } }
  function applyTheme(t) { const el = document.documentElement; if (t === 'light' || t === 'dark') el.dataset.theme = t; else delete el.dataset.theme; }
  applyTheme(readTheme());

  /* -------------------------------------------------------------------
   * §4.1 Store + history
   * ----------------------------------------------------------------- */
  function createStore(initial) {
    let state = initial; const subs = new Set();
    return {
      get: () => state,
      set(fn) { const next = typeof fn === 'function' ? fn(state) : Object.assign({}, state, fn); if (next !== state) { state = next; subs.forEach((s) => s()); } },
      subscribe(f) { subs.add(f); return () => subs.delete(f); },
    };
  }
  const store = createStore({
    doc: IO.emptyProject(), past: [], future: [], loadSeq: 0,
    selection: { nodes: [], edges: [] },
    results: null, stale: true, running: false,
    autoCalc: true, showLabels: true, showMinimap: false,
    colorBy: 'power',         // drawing colours: 'power' | 'loss' (component borders) | 'throttle' (flow controllers only) | 'pressure' (connections, ports) | 'none'
    theme: readTheme(),       // 'auto' | 'light' | 'dark'
    dialog: null, toast: null,
    examples: [],             // [{id, title}] of the §7 example blocks, filled after the page is parsed
  });
  const useStore = (sel) => useSyncExternalStore(store.subscribe, () => sel(store.get()));
  let fileHandle = null;        // File System Access API handle of the open project (Chromium only)
  let rfApi = null;             // React Flow instance, set by <Editor/>

  /** Apply an edit to the document. physics:false = layout-only change (no recalculation). */
  function commit(mutate, { history = true, physics = true } = {}) {
    store.set((s) => {
      const doc = mutate(s.doc);
      if (!doc || doc === s.doc) return s;
      return Object.assign({}, s, { doc, past: history ? [...s.past.slice(-99), s.doc] : s.past, future: history ? [] : s.future, stale: s.stale || physics });
    });
    scheduleAutosave();
    if (physics) scheduleCalc();
  }
  function setTheme(t) {
    store.set({ theme: t }); applyTheme(t);
    try { if (t === 'auto') localStorage.removeItem(THEME_KEY); else localStorage.setItem(THEME_KEY, t); } catch (e) { /* no storage: applies to this session only */ }
  }
  const pushHistory = () => store.set((s) => Object.assign({}, s, { past: [...s.past.slice(-99), s.doc], future: [] }));
  /** Drop selected ids that no longer exist (after undo/redo). */
  const pruneSelection = (s, doc) => {
    const cs = new Set(doc.components.map((c) => c.id)), ks = new Set(doc.connections.map((k) => k.id));
    return { nodes: s.selection.nodes.filter((id) => cs.has(id) || id === BG_ID), edges: s.selection.edges.filter((id) => ks.has(id)) };
  };
  function undo() { store.set((s) => { if (!s.past.length) return s; const doc = s.past[s.past.length - 1]; return Object.assign({}, s, { doc, past: s.past.slice(0, -1), future: [s.doc, ...s.future], stale: true, selection: pruneSelection(s, doc) }); }); scheduleCalc(); scheduleAutosave(); }
  function redo() { store.set((s) => { if (!s.future.length) return s; const doc = s.future[0]; return Object.assign({}, s, { doc, future: s.future.slice(1), past: [...s.past, s.doc], stale: true, selection: pruneSelection(s, doc) }); }); scheduleCalc(); scheduleAutosave(); }
  function loadDoc(doc, notes) {
    store.set((s) => Object.assign({}, s, { doc, past: [], future: [], selection: { nodes: [], edges: [] }, results: null, stale: true, loadSeq: s.loadSeq + 1 }));
    (notes || []).forEach((n) => toast(n));
    scheduleAutosave(); runCalc();
  }
  const updateComponent = (id, fn, opts) => commit((d) => Object.assign({}, d, { components: d.components.map((c) => (c.id === id ? fn(c) : c)) }), opts);
  const setProps = (id, patch) => updateComponent(id, (c) => Object.assign({}, c, { props: Object.assign({}, c.props, patch) }));
  function toast(msg, kind) { store.set({ toast: { msg, kind: kind || 'info', t: Date.now() } }); setTimeout(() => { if (store.get().toast?.msg === msg) store.set({ toast: null }); }, 4500); }

  let autosaveTimer = 0;
  function scheduleAutosave() {
    clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(() => { try { localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(store.get().doc)); } catch (e) { /* quota or no storage: ignore */ } }, 600);
  }

  /* -------------------------------------------------------------------
   * §4.2 Calculation runner: Web Worker built from the §1 script text,
   * falls back to the main thread if workers are unavailable.
   * ----------------------------------------------------------------- */
  let worker = null, calcSeq = 0, calcTimer = 0;
  try {
    const src = document.getElementById('luka-core').textContent +
      '\nself.onmessage = (e) => { let r; try { r = LukaCore.calculate(e.data.doc); } catch (err) { r = { ok: false, errors: [{ msg: String(err && err.message || err), ids: [] }], warnings: [], components: {}, nodes: [], stats: {} }; } self.postMessage({ seq: e.data.seq, r }); };';
    worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    worker.onmessage = (e) => { if (e.data.seq === calcSeq) store.set({ results: e.data.r, running: false, stale: false }); };
    worker.onerror = () => { worker = null; runCalc(); };
  } catch (e) { worker = null; }
  function runCalc() {
    const { doc } = store.get(); const seq = ++calcSeq;
    store.set({ running: true });
    if (worker) { worker.postMessage({ seq, doc }); return; }
    setTimeout(() => {
      let r; try { r = C.calculate(doc); } catch (err) { r = { ok: false, errors: [{ msg: String(err.message || err), ids: [] }], warnings: [], components: {}, nodes: [], stats: {} }; }
      if (seq === calcSeq) store.set({ results: r, running: false, stale: false });
    }, 0);
  }
  function scheduleCalc() { clearTimeout(calcTimer); if (store.get().autoCalc) calcTimer = setTimeout(runCalc, 250); }

  /* -------------------------------------------------------------------
   * §4.3 Symbols (52×52 viewBox, flow left → right, branch at bottom)
   * and palette. Keys are component `kind`s.
   * ----------------------------------------------------------------- */
  const box = html`<rect x="8" y="14" width="36" height="24" rx="1.5"/>`;
  const SYMBOLS = {
    duct: html`<path d="M4 17H48M4 35H48"/><path d="M20 26H32M28 22l4 4-4 4" strokeWidth="1.4"/>`,
    bend: html`<path d="M8 12A32 32 0 0 1 40 44M8 26A18 18 0 0 1 26 44M8 12V26M26 44H40"/>`,
    filter: html`${box}<path d="M12 14 16 38 20 14 24 38 28 14 32 38 36 14 40 38" strokeWidth="1.3"/>`,
    fireDamper: html`${box}<path d="M16 34 36 18" strokeWidth="2.4"/><circle cx="26" cy="26" r="2" fill="currentColor"/><path d="M8 10H44" strokeWidth="3"/>`,
    smokeDamper: html`${box}<path d="M16 34 36 18" strokeWidth="2.4"/><circle cx="26" cy="26" r="2" fill="currentColor"/><path d="M10 8q4-3 8 0t8 0 8 0 8 0" strokeWidth="1.3"/>`,
    soundAbsorber: html`${box}<path d="M17 14V38M26 14V38M35 14V38" strokeWidth="4.5" strokeOpacity=".55"/>`,
    throttle: html`<path d="M4 17H48M4 35H48"/><ellipse cx="26" cy="26" rx="4" ry="10.5" transform="rotate(35 26 26)"/><circle cx="26" cy="26" r="1.6" fill="currentColor"/>`,
    custom: html`${box}<text x="26" y="32" textAnchor="middle" fontSize="17" fontStyle="italic" fill="currentColor" stroke="none">ζ</text>`,
    tee: html`<path d="M4 15H48M4 31H18V48M34 48V31H48"/>`,
    generic: html`<circle cx="26" cy="26" r="16"/><path d="M14 16 41 26 14 36"/>`,
    axial: html`<circle cx="26" cy="26" r="16"/><path d="M26 26c-2-6 0-10 4-11M26 26c6 2 8 6 5 10M26 26c-5 4-9 4-11 0"/><circle cx="26" cy="26" r="2" fill="currentColor"/>`,
    radial: html`<path d="M26 10a16 16 0 1 0 16 16V10Z"/><circle cx="26" cy="26" r="6"/>`,
    sizing: html`<circle cx="26" cy="26" r="16"/><text x="26" y="32" textAnchor="middle" fontSize="17" fill="currentColor" stroke="none">?</text>`,
    controller: html`${box}<path d="M14 36 38 16M33 16h5v5" strokeWidth="1.6"/><text x="15" y="25" fontSize="9" fill="currentColor" stroke="none">V̇</text>`,
    fixedDp: html`${box}<text x="26" y="31.5" textAnchor="middle" fontSize="14" fill="currentColor" stroke="none">Δp</text><path d="M12 42H40" strokeWidth="1.2" strokeDasharray="2 2.5"/>`,
  };
  const ReTag = html`<text x="45" y="49" textAnchor="end" fontSize="9" fill="currentColor" stroke="none" fontWeight="600">Re</text>`;
  function Symbol({ kind, type, rotation = 0, size = NODE }) {
    return html`<svg className="sym" width=${size} height=${size} viewBox="0 0 52 52" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
      <g transform=${`rotate(${rotation} 26 26)`}>${SYMBOLS[kind] || SYMBOLS.custom}</g>${(type === 'zetaRe' || type === 'bendRe') ? ReTag : null}</svg>`;
  }
  const PALETTE = [
    { group: 'Ducts and tees', items: [['duct', 'duct'], ['tee', 'tee']] },
    // one entry per kind; fixed or Re-dependent ζ is chosen afterwards with the "ζ model" switch (§4.6)
    { group: 'Fittings and components', items: [['zeta', 'bend'], ['zeta', 'filter'], ['zeta', 'fireDamper'], ['zeta', 'smokeDamper'], ['zeta', 'soundAbsorber'], ['zeta', 'throttle'], ['zeta', 'custom'], ['fixedDp', 'fixedDp']] },
    { group: 'Fans', items: [['fan', 'generic'], ['fan', 'axial'], ['fan', 'radial']] },
    { group: 'Fan sizing', items: [['fanSizing', 'sizing'], ['controller', 'controller']] },
  ];
  const KIND_DEFAULTS = { filter: { zeta: 25 } };
  const compLabel = (c) => C.KINDS[c.kind] || C.TYPES[c.type].label;
  const modelLabel = (c) => C.modelLabel(c);

  function addComponent(type, kind, x, y) {
    const doc = store.get().doc, id = IO.nextId(doc, 'c'), c = C.newComponent(type, kind, Math.round(x), Math.round(y), id);
    if (type === 'zeta' && KIND_DEFAULTS[kind]) Object.assign(c.props, KIND_DEFAULTS[kind]);
    commit((d) => Object.assign({}, d, { components: [...d.components, c] }));
    store.set({ selection: { nodes: [id], edges: [] } });
  }

  /* -------------------------------------------------------------------
   * §4.4 Property fields per type. Display scale converts SI → shown unit.
   * kind: num | section | retable (Re/ζ pairs) | curve | mode | info
   * ----------------------------------------------------------------- */
  const F = (key, label, unit, scale = 1, extra) => Object.assign({ kind: 'num', key, label, unit, scale }, extra);
  const FIELDS = {
    duct: [F('length', 'Length', 'm', 1, { min: 0 }), F('roughness', 'Roughness k', 'mm', 1000, { min: 0 }), { kind: 'section', key: 'section', label: 'Cross-section' }],
    zeta: [F('zeta', 'ζ', '', 1, { min: 0 }), { kind: 'section', key: 'section', label: 'Cross-section' }],
    zetaRe: [F('zetaRef', 'ζ at Re = 2·10⁵', '', 1, { min: 0, when: (p) => p.mode === 'powerLaw' }),
      F('n', 'Exponent n in ζ = ζref·(Re/2·10⁵)⁻ⁿ', '', 1, { when: (p) => p.mode === 'powerLaw' }),
      { kind: 'retable' },
      { kind: 'curve' }, { kind: 'section', key: 'section', label: 'Cross-section' }],
    bendRe: [F('radius', 'Bend radius R', 'mm', 1000, { min: 0 }), F('zetaRef', 'ζ at Re = 2·10⁵ (0 = from correlation)', '', 1, { min: 0 }),
      F('relRoughness', 'Relative roughness k/D', '', 1, { min: 0 }), { kind: 'retable' },
      { kind: 'curve' }, { kind: 'section', key: 'section', label: 'Cross-section (rect: W = width in bend plane)' }],
    tee: [F('zetaIn', 'ζ in', '', 1), F('zetaOut', 'ζ out', '', 1), F('zetaBranch', 'ζ branch', '', 1),
      { kind: 'section', key: 'sectionIn', label: 'Section in' }, { kind: 'section', key: 'sectionOut', label: 'Section out' }, { kind: 'section', key: 'sectionBranch', label: 'Section branch' }],
    fan: [F('flow', 'Volume flow', 'm³/h', 3600, { min: 0 })],
    fanSizing: [{ kind: 'info', text: 'Finds the fan pressure needed so that every flow controller reaches its set flow; the most critical controller ends up fully open.' }],
    controller: [F('flow', 'Set volume flow', 'm³/h', 3600, { min: 0 }), F('zetaOpen', 'ζ when fully open', '', 1, { min: 0 }), { kind: 'section', key: 'section', label: 'Cross-section' }],
    fixedDp: [F('dpFixed', 'Pressure change Δp = p_out − p_in', 'Pa', 1, { signed: true, hint: 'Negative = pressure loss (e.g. −120 for a filter from its data sheet), positive = pressure rise (booster fan). Held at every volume flow.' }),
      { kind: 'effZeta' }, { kind: 'section', key: 'section', label: 'Cross-section (for velocity and effective ζ)' }],
  };

  /* -------------------------------------------------------------------
   * Formatting + pressure colour scale (diverging around atmosphere)
   * ----------------------------------------------------------------- */
  function fmtSmart(x) {
    if (x === null || x === undefined || !isFinite(x)) return '–';
    const a = Math.abs(x);
    if (a < 1e-10) return '0';
    const d = a >= 1000 ? 0 : a >= 100 ? 1 : a >= 10 ? 1 : a >= 1 ? 2 : a >= 0.01 ? 3 : a === 0 ? 0 : 4;
    if (a !== 0 && a < 1e-4) return x.toExponential(2);
    return x.toLocaleString('en-US', { maximumFractionDigits: d });
  }
  const NEG = [37, 99, 235], POS = [194, 65, 12], MID = [138, 151, 158];
  function pressureColor(p, pmax) {
    if (p === undefined || !pmax) return null;
    const t = Math.min(1, Math.abs(p) / pmax), to = p < 0 ? NEG : POS;
    const c = MID.map((m, i) => Math.round(m + (to[i] - m) * Math.pow(t, 0.7)));
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  }
  /* Pressure loss of a component = spread of its port pressures (max − min): for 2-port parts p_in − p_out,
   * for tees the largest leg-to-leg difference. Fans and fan sizing add pressure and are not coloured.
   * Sequential scale pale → yellow → orange → red on √(Δp/Δp_max), so small losses stay distinguishable. */
  const LOSS_STOPS = [[0, [206, 216, 220]], [0.35, [245, 205, 90]], [0.7, [238, 128, 36]], [1, [179, 38, 30]]];
  function lossColor(t, stops = LOSS_STOPS) {
    let i = 1; while (i < stops.length - 1 && t > stops[i][0]) i++;
    const [t0, a] = stops[i - 1], [t1, b] = stops[i], f = Math.max(0, Math.min(1, (t - t0) / (t1 - t0)));
    return `rgb(${a.map((x, k) => Math.round(x + (b[k] - x) * f)).join(',')})`;
  }
  const NOT_A_LOSS = new Set(['fan', 'fanSizing']);
  const isSource = (c) => NOT_A_LOSS.has(c.type) || (c.type === 'fixedDp' && +c.props.dpFixed > 0);
  function componentLoss(c, r) {
    if (!r?.portP || isSource(c)) return null;
    const ps = Object.values(r.portP); return Math.max(...ps) - Math.min(...ps);
  }
  /** Hydraulic power loss Δp·Q in W (result value 'ploss' from the core; tees: Σ p·Q over the ports). */
  function componentPower(c, r) {
    if (isSource(c)) return null;
    const v = r?.values?.find((x) => x.key === 'ploss'); return v ? Math.abs(v.value) : null;
  }
  /* Throttling pressure of a flow controller (result 'dpThrottle'); null for every other component, so only
   * controllers are coloured. 0 = fully open: in fan sizing the critical path; > 0 = throttled; < 0 = lacks pressure.
   * Scale teal (open) → yellow → orange → red (most throttled) on √(Δp/Δp_max), so slightly throttled
   * controllers already move away from teal; negative values get a separate magenta. */
  const THROTTLE_OPEN_TOL = 0.05;   // Pa; at or below this a controller counts as fully open
  const THROTTLE_STOPS = [[0, [13, 148, 136]], [0.3, [170, 200, 80]], [0.6, [242, 172, 50]], [1, [179, 38, 30]]];
  const THROTTLE_LACK = [192, 38, 160];
  function componentThrottle(c, r) {
    if (c.type !== 'controller') return null;
    const v = r?.values?.find((x) => x.key === 'dpThrottle'); return v ? v.value : null;
  }
  const throttleState = (v) => (v < -THROTTLE_OPEN_TOL ? 'lack' : v <= THROTTLE_OPEN_TOL ? 'open' : 'throttled');
  function throttleColor(v, max) {
    const st = throttleState(v);
    if (st === 'lack') return `rgb(${THROTTLE_LACK.join(',')})`;
    if (st === 'open' || !(max > 0)) return `rgb(${THROTTLE_STOPS[0][1].join(',')})`;
    return lossColor(Math.sqrt(Math.min(1, v / max)), THROTTLE_STOPS);
  }
  const RING_METRICS = {
    power: { of: componentPower, title: 'Hydraulic power loss', unit: 'W' },
    loss: { of: componentLoss, title: 'Pressure loss', unit: 'Pa' },
    throttle: { of: componentThrottle, title: 'Throttling pressure of flow controllers', unit: 'Pa', color: throttleColor },
  };
  const portPressure = (res, cid, port) => res?.components?.[cid]?.portP?.[port];
  function badgeFor(c, r, colorBy) {
    if (!r) return null;
    const v = (k) => r.values.find((x) => x.key === k)?.value;
    switch (c.type) {
      case 'fan': return [`Δp ${fmtSmart(v('dpfan'))} Pa`, `${fmtSmart(v('q'))} m³/h`];
      case 'fanSizing': return [`needs ${fmtSmart(v('dpfan'))} Pa`, `${fmtSmart(v('q'))} m³/h`];
      case 'controller': {
        if (colorBy === 'throttle') {
          const t = v('dpThrottle'), st = throttleState(t);
          return [st === 'open' ? 'fully open' : st === 'lack' ? `lacks ${fmtSmart(-t)} Pa` : `throttles ${fmtSmart(t)} Pa`, `${fmtSmart(v('q'))} m³/h`];
        }
        return [`ζ ${fmtSmart(v('zetaThrottle'))}`, `${fmtSmart(v('q'))} m³/h`];
      }
      case 'tee': return [`${fmtSmart(Math.abs(v('qin')))} m³/h`];
      case 'fixedDp': return [`Δp ${fmtSmart(+c.props.dpFixed)} Pa · ζ ${fmtSmart(v('zeta'))}`, `${fmtSmart(Math.abs(v('q')))} m³/h`];
      default: return [`${fmtSmart(v('dp'))} Pa`, `${fmtSmart(Math.abs(v('q')))} m³/h`];
    }
  }

  /* -------------------------------------------------------------------
   * §4.5 Canvas: custom node, background node, pipe edge, editor
   * ----------------------------------------------------------------- */
  const SIDES = ['left', 'top', 'right', 'bottom'];
  const BASE_SIDE = { in: 'left', out: 'right', branch: 'bottom' };
  const sideFor = (port, rot) => SIDES[(SIDES.indexOf(BASE_SIDE[port]) + rot / 90) % 4];
  const PORT_NAMES = { in: 'inlet', out: 'outlet', branch: 'branch' };

  function LukaNode({ data, selected }) {
    const { c, res, stale, showLabels, linked, pmax, colorBy, ring, critical } = data;
    const T = C.TYPES[c.type], badge = showLabels ? badgeFor(c, res, colorBy) : null;
    const loss = componentLoss(c, res), power = componentPower(c, res), thr = componentThrottle(c, res);
    const lossTip = (loss !== null ? ` – pressure loss ${fmtSmart(loss)} Pa` + (power !== null ? `, power loss ${fmtSmart(power)} W` : '') : '')
      + (thr !== null ? `, throttling pressure ${fmtSmart(thr)} Pa` + (throttleState(thr) === 'open' ? ' (fully open)' : '') : '');
    return html`<div className=${'ln' + (selected ? ' is-selected' : '') + (ring ? ' has-ring' : '') + (ring && stale ? ' is-stale' : '') + (critical ? ' is-critical' : '')} style=${ring ? { '--ring': ring } : null}
      title=${`${c.name ? c.name + ' – ' : ''}${compLabel(c)} (${modelLabel(c)})${lossTip}`}>
      <${Symbol} kind=${c.kind} type=${c.type} rotation=${c.rotation}/>
      ${T.ports.map((p) => {
        const open = !linked.has(c.id + ':' + p), pp = res?.portP?.[p];
        return html`<${RF.Handle} key=${p} id=${p} type="source" position=${sideFor(p, c.rotation)}
          className=${'port' + (open ? ' is-open' : '')} style=${colorBy === 'pressure' && !open && pp !== undefined ? { background: pressureColor(pp, pmax) } : null}
          title=${`${PORT_NAMES[p]}${open ? ' – open to atmosphere' : ''}${pp !== undefined ? ` – ${fmtSmart(pp)} Pa` : ''}`}/>`;
      })}
      ${(c.name || badge) && html`<div className=${'ln-text' + (stale ? ' is-stale' : '')}>
        ${c.name && html`<div className="ln-name">${c.name}</div>`}
        ${badge && badge.map((b, i) => html`<div key=${i} className="ln-val">${b}</div>`)}
      </div>`}
    </div>`;
  }
  function BackgroundNode({ data, selected }) {
    const bg = data.bg;
    return html`<div className="bgnode" style=${{ opacity: bg.opacity }}>
      <${RF.NodeResizer} isVisible=${selected && !bg.locked} keepAspectRatio=${true} minWidth=${40} minHeight=${40}/>
      <img src=${bg.dataUrl} alt="Background drawing" draggable="false"/>
    </div>`;
  }
  function PipeEdge({ id, sourceX, sourceY, targetX, targetY, data, selected }) {
    const [path, lx, ly] = RF.getStraightPath({ sourceX, sourceY, targetX, targetY });
    return html`<${React.Fragment}>
      <${RF.BaseEdge} id=${id} path=${path} interactionWidth=${14}
        style=${{ stroke: data?.color || 'var(--line-strong)', strokeWidth: selected ? 5 : 3, opacity: data?.stale ? 0.55 : 1 }}/>
      ${selected && data?.p !== undefined && html`<${RF.EdgeLabelRenderer}>
        <div className="edge-label nodrag nopan" style=${{ transform: `translate(-50%, -50%) translate(${lx}px, ${ly}px)` }}>${fmtSmart(data.p)} Pa</div>
      <//>`}
    <//>`;
  }
  const nodeTypes = { luka: LukaNode, bg: BackgroundNode };
  const edgeTypes = { pipe: PipeEdge };

  function Editor() {
    const doc = useStore((s) => s.doc), results = useStore((s) => s.results), stale = useStore((s) => s.stale);
    const selection = useStore((s) => s.selection), showLabels = useStore((s) => s.showLabels), showMinimap = useStore((s) => s.showMinimap);
    const loadSeq = useStore((s) => s.loadSeq), theme = useStore((s) => s.theme);
    const rf = RF.useReactFlow(); rfApi = rf;
    const gesture = useRef(false);

    // fit after loading a document; skipped for empty docs (RF v12 would queue the fit and zoom onto the first dropped node)
    useEffect(() => { if (!store.get().doc.components.length) return; const t = setTimeout(() => rf.fitView({ padding: 0.15, duration: 0 }), 30); return () => clearTimeout(t); }, [loadSeq]);

    const linked = useMemo(() => { const s = new Set(); for (const k of doc.connections) { s.add(k.a.c + ':' + k.a.port); s.add(k.b.c + ':' + k.b.port); } return s; }, [doc.connections]);
    const pmax = useMemo(() => { let m = 0; for (const n of results?.nodes || []) m = Math.max(m, Math.abs(n.p)); return m; }, [results]);
    const colorBy = useStore((s) => s.colorBy);
    const losses = useMemo(() => {                         // values of the active ring metric (power or pressure loss)
      const map = new Map(); let max = 0, metric = RING_METRICS[colorBy];
      if (results?.ok && metric) for (const c of doc.components) { const l = metric.of(c, results.components[c.id]); if (l !== null) { map.set(c.id, l); max = Math.max(max, l); } }
      return { map, max, metric, show: !!metric && (metric.color ? map.size > 0 : max > 0) };
    }, [results, doc.components, colorBy]);
    const selN = useMemo(() => new Set(selection.nodes), [selection]), selE = useMemo(() => new Set(selection.edges), [selection]);

    const nodes = useMemo(() => {
      const list = doc.components.map((c) => ({
        id: c.id, type: 'luka', position: { x: c.x - NODE / 2, y: c.y - NODE / 2 }, selected: selN.has(c.id),
        data: { c, res: results?.components?.[c.id], stale, showLabels, linked, pmax, colorBy,
          ring: !losses.show || !losses.map.has(c.id) ? null
            : losses.metric.color ? losses.metric.color(losses.map.get(c.id), losses.max)
            : lossColor(Math.sqrt(Math.max(0, losses.map.get(c.id)) / losses.max)),
          critical: colorBy === 'throttle' && losses.map.has(c.id) && throttleState(losses.map.get(c.id)) === 'open' },
      }));
      const bg = doc.background;
      if (bg) list.unshift({ id: BG_ID, type: 'bg', position: { x: bg.x, y: bg.y }, width: bg.width, height: bg.height, style: { width: bg.width, height: bg.height },
        zIndex: -1, draggable: !bg.locked, selectable: !bg.locked, deletable: false, connectable: false, focusable: false, selected: selN.has(BG_ID), data: { bg } });
      return list;
    }, [doc.components, doc.background, results, stale, showLabels, linked, pmax, selN, colorBy, losses]);

    const edges = useMemo(() => doc.connections.map((k) => {
      const p = portPressure(results, k.a.c, k.a.port);
      return { id: k.id, type: 'pipe', source: k.a.c, sourceHandle: k.a.port, target: k.b.c, targetHandle: k.b.port, selected: selE.has(k.id),
        data: { p, color: colorBy === 'pressure' ? pressureColor(p, pmax) : null, stale } };
    }), [doc.connections, results, pmax, selE, stale, colorBy]);

    const onNodesChange = useCallback((changes) => {
      const pos = new Map(); let sel = null, bgDim = null, ended = false;
      for (const ch of changes) {
        if (ch.type === 'position') {
          if (ch.dragging && !gesture.current) { gesture.current = true; pushHistory(); }
          if (ch.dragging === false) ended = true;
          if (ch.position) pos.set(ch.id, ch.position);
        } else if (ch.type === 'select') (sel = sel || []).push(ch);
        else if (ch.type === 'dimensions' && ch.id === BG_ID && ch.dimensions && ch.resizing !== undefined) {
          if (ch.resizing && !gesture.current) { gesture.current = true; pushHistory(); }
          if (!ch.resizing) ended = true;
          bgDim = ch.dimensions;
        }
      }
      if (pos.size || bgDim) commit((d) => {
        const out = Object.assign({}, d);
        if (pos.size) out.components = d.components.map((c) => pos.has(c.id) ? Object.assign({}, c, { x: Math.round(pos.get(c.id).x + NODE / 2), y: Math.round(pos.get(c.id).y + NODE / 2) }) : c);
        if (d.background && (pos.has(BG_ID) || bgDim)) out.background = Object.assign({}, d.background, pos.has(BG_ID) ? { x: pos.get(BG_ID).x, y: pos.get(BG_ID).y } : {}, bgDim ? { width: bgDim.width, height: bgDim.height } : {});
        return out;
      }, { history: false, physics: false });
      if (ended) gesture.current = false;
      if (sel) store.set((s) => {
        const set = new Set(s.selection.nodes);
        for (const ch of sel) ch.selected ? set.add(ch.id) : set.delete(ch.id);
        return Object.assign({}, s, { selection: { nodes: [...set], edges: s.selection.edges } });
      });
    }, []);
    const onEdgesChange = useCallback((changes) => {
      const sel = changes.filter((ch) => ch.type === 'select');
      if (sel.length) store.set((s) => {
        const set = new Set(s.selection.edges);
        for (const ch of sel) ch.selected ? set.add(ch.id) : set.delete(ch.id);
        return Object.assign({}, s, { selection: { nodes: s.selection.nodes, edges: [...set] } });
      });
    }, []);
    const onConnect = useCallback((p) => {
      if (p.source === p.target) return;
      commit((d) => {
        const key = [p.source + ':' + p.sourceHandle, p.target + ':' + p.targetHandle].sort().join('|');
        if (d.connections.some((k) => [k.a.c + ':' + k.a.port, k.b.c + ':' + k.b.port].sort().join('|') === key)) return d;
        return Object.assign({}, d, { connections: [...d.connections, { id: IO.nextId(d, 'k'), a: { c: p.source, port: p.sourceHandle }, b: { c: p.target, port: p.targetHandle } }] });
      });
    }, []);
    const onDelete = useCallback(({ nodes: ns, edges: es }) => deleteItems(ns.map((n) => n.id), es.map((e) => e.id)), []);
    const onDrop = useCallback((e) => {
      e.preventDefault();
      const raw = e.dataTransfer.getData('application/x-luka'); if (!raw) return;
      const { type, kind } = JSON.parse(raw), p = rf.screenToFlowPosition({ x: e.clientX, y: e.clientY });
      addComponent(type, kind, p.x, p.y);
    }, [rf]);

    return html`<div className="canvas" onDragOver=${(e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; }} onDrop=${onDrop}>
      <${RF.ReactFlow} nodes=${nodes} edges=${edges} nodeTypes=${nodeTypes} edgeTypes=${edgeTypes}
        onNodesChange=${onNodesChange} onEdgesChange=${onEdgesChange} onConnect=${onConnect} onDelete=${onDelete}
        isValidConnection=${(p) => p.source !== p.target}
        connectionMode="loose" connectionRadius=${18} deleteKeyCode=${['Delete', 'Backspace']} multiSelectionKeyCode=${['Meta', 'Control']}
        selectionKeyCode="Shift" minZoom=${0.05} maxZoom=${6} colorMode=${theme === 'auto' ? 'system' : theme} zoomOnDoubleClick=${false}
        defaultEdgeOptions=${{ type: 'pipe' }} connectionLineStyle=${{ stroke: 'var(--accent)', strokeWidth: 2 }} proOptions=${{ hideAttribution: false }}>
        <${RF.Background} variant="dots" gap=${24} size=${1.2} color="var(--grid)"/>
        <${RF.Controls} showInteractive=${false} position="bottom-left"/>
        ${showMinimap && html`<${RF.MiniMap} pannable zoomable position="bottom-right" nodeStrokeWidth=${2}/>`}
        ${doc.components.length === 0 && html`<${RF.Panel} position="top-center"><${EmptyState}/><//>`}
        ${results?.ok && colorBy === 'pressure' && pmax > 0 && html`<${RF.Panel} position="top-right"><${Legend} pmax=${pmax} stale=${stale}/><//>`}
        ${results?.ok && losses.show && colorBy !== 'throttle' && html`<${RF.Panel} position="top-right"><${LossLegend} max=${losses.max} metric=${losses.metric} stale=${stale}/><//>`}
        ${results?.ok && losses.show && colorBy === 'throttle' && html`<${RF.Panel} position="top-right"><${ThrottleLegend} losses=${losses} components=${doc.components} stale=${stale}/><//>`}
        ${results?.ok && !losses.show && colorBy === 'throttle' && html`<${RF.Panel} position="top-right"><div className="legend legend-throttle"><div className="legend-title">Throttling pressure of flow controllers</div>
          <div className="legend-row">This network has no flow controllers, so nothing is coloured.</div></div><//>`}
      <//>
    </div>`;
  }
  function deleteItems(nodeIds, edgeIds) {
    const ns = new Set(nodeIds.filter((id) => id !== BG_ID)), es = new Set(edgeIds);
    if (!ns.size && !es.size) return;
    commit((d) => Object.assign({}, d, {
      components: d.components.filter((c) => !ns.has(c.id)),
      connections: d.connections.filter((k) => !es.has(k.id) && !ns.has(k.a.c) && !ns.has(k.b.c)),
    }));
    store.set({ selection: { nodes: [], edges: [] } });
  }
  function rotateSelection() {
    const ids = new Set(store.get().selection.nodes); if (!ids.size) return;
    commit((d) => Object.assign({}, d, { components: d.components.map((c) => ids.has(c.id) ? Object.assign({}, c, { rotation: (c.rotation + 90) % 360 }) : c) }), { physics: false });
  }
  /** Align or distribute the selected components like PowerPoint. The reference is the bounding box of
   *  the selected symbol centres (all symbols have the same size, so left/centre/right edges coincide
   *  with the centres). Layout-only: no recalculation, one undo step. */
  const ALIGN = [
    ['left', 'Align left'], ['center', 'Align center (in a column)'], ['right', 'Align right'],
    ['top', 'Align top'], ['middle', 'Align middle (in a row)'], ['bottom', 'Align bottom'],
    ['distH', 'Distribute horizontally'], ['distV', 'Distribute vertically'],
  ];
  const selectedComponents = (s) => { const ids = new Set(s.selection.nodes); return s.doc.components.filter((c) => ids.has(c.id)); };
  function alignSelection(mode) {
    const sel = selectedComponents(store.get());
    const dist = mode === 'distH' || mode === 'distV';
    if (sel.length < (dist ? 3 : 2)) { toast(dist ? 'Select at least three components to distribute them.' : 'Select at least two components to align them.'); return; }
    const xs = sel.map((c) => c.x), ys = sel.map((c) => c.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
    const target = new Map();
    const set = (c, p) => target.set(c.id, p);
    if (mode === 'left') sel.forEach((c) => set(c, { x: minX }));
    else if (mode === 'right') sel.forEach((c) => set(c, { x: maxX }));
    else if (mode === 'center') sel.forEach((c) => set(c, { x: Math.round((minX + maxX) / 2) }));
    else if (mode === 'top') sel.forEach((c) => set(c, { y: minY }));
    else if (mode === 'bottom') sel.forEach((c) => set(c, { y: maxY }));
    else if (mode === 'middle') sel.forEach((c) => set(c, { y: Math.round((minY + maxY) / 2) }));
    else if (mode === 'distH') { const s = sel.slice().sort((a, b) => a.x - b.x), step = (maxX - minX) / (s.length - 1); s.forEach((c, i) => set(c, { x: Math.round(minX + i * step) })); }
    else if (mode === 'distV') { const s = sel.slice().sort((a, b) => a.y - b.y), step = (maxY - minY) / (s.length - 1); s.forEach((c, i) => set(c, { y: Math.round(minY + i * step) })); }
    commit((d) => {
      let changed = false;
      const components = d.components.map((c) => {
        const t = target.get(c.id); if (!t) return c;
        const n = Object.assign({}, c, t); if (n.x !== c.x || n.y !== c.y) changed = true; return n;
      });
      return changed ? Object.assign({}, d, { components }) : d;

  /** Centre of the visible drawing area in canvas coordinates, optionally with a random jitter (px). */
  function viewCentre(jitter = 0) {
    const r = document.querySelector('.canvas')?.getBoundingClientRect();
    if (!rfApi || !r) return { x: 0, y: 0 };
    return rfApi.screenToFlowPosition({ x: r.left + r.width / 2 + (Math.random() - 0.5) * jitter, y: r.top + r.height / 2 + (Math.random() - 0.5) * jitter });
  }
  /** Duplicate the selected components (Ctrl+D). Copies keep their relative layout, rotation, names and
   *  properties; only connections between two selected components are copied. The copy is centred in the
   *  current view (like new palette components); if any copy would sit on an existing symbol (incl. its
   *  label below), the nearest free spot on a DUP_OFFSET grid around the view centre is used, and the
   *  view pans there if needed. Afterwards the copies are selected. One undo step. */
  const DUP_OFFSET = 80, CLEAR_X = 70, CLEAR_Y = 90;
  function duplicateSelection() {
    const s = store.get(), sel = selectedComponents(s);
    if (!sel.length) { toast('Select one or more components to duplicate them.'); return; }
    const xs = sel.map((c) => c.x), ys = sel.map((c) => c.y);
    const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
    const vc = viewCentre();
    const baseX = Math.round(vc.x - cx), baseY = Math.round(vc.y - cy);
    const blocked = (dx, dy) => sel.some((c) => s.doc.components.some((o) => Math.abs(c.x + dx - o.x) < CLEAR_X && Math.abs(c.y + dy - o.y) < CLEAR_Y));
    // search outward from the view centre in rings of DUP_OFFSET steps; nearest free spot wins
    let dx = baseX, dy = baseY;
    search: for (let r = 0; r <= 25; r++) {
      const ring = [];
      for (let i = -r; i <= r; i++) for (let j = -r; j <= r; j++) if (Math.max(Math.abs(i), Math.abs(j)) === r) ring.push([i, j]);
      ring.sort((p, q) => Math.hypot(...p) - Math.hypot(...q));
      for (const [i, j] of ring) if (!blocked(baseX + i * DUP_OFFSET, baseY + j * DUP_OFFSET)) { dx = baseX + i * DUP_OFFSET; dy = baseY + j * DUP_OFFSET; break search; }
    }
    const ids = new Set(sel.map((c) => c.id)), map = new Map();
    let work = { components: s.doc.components.slice(), connections: s.doc.connections.slice() };
    const copies = sel.map((c) => {
      const id = IO.nextId(work, 'c'); map.set(c.id, id);
      const copy = Object.assign(JSON.parse(JSON.stringify(c)), { id, x: Math.round(c.x + dx), y: Math.round(c.y + dy) });
      work.components.push(copy); return copy;
    });
    const links = s.doc.connections.filter((k) => ids.has(k.a.c) && ids.has(k.b.c)).map((k) => {
      const link = { id: IO.nextId(work, 'k'), a: { c: map.get(k.a.c), port: k.a.port }, b: { c: map.get(k.b.c), port: k.b.port } };
      work.connections.push(link); return link;
    });
    commit((d) => Object.assign({}, d, { components: [...d.components, ...copies], connections: [...d.connections, ...links] }));
    store.set({ selection: { nodes: copies.map((c) => c.id), edges: links.map((k) => k.id) } });
    // if the free spot is outside the visible area, pan there (zoom unchanged)
    const r = document.querySelector('.canvas')?.getBoundingClientRect();
    if (rfApi && r) {
      const cxs = copies.map((c) => c.x), cys = copies.map((c) => c.y), h = NODE / 2;
      const tl = rfApi.flowToScreenPosition({ x: Math.min(...cxs) - h, y: Math.min(...cys) - h });
      const br = rfApi.flowToScreenPosition({ x: Math.max(...cxs) + h, y: Math.max(...cys) + h + 30 });
      if (tl.x < r.left || tl.y < r.top || br.x > r.right || br.y > r.bottom) {
        rfApi.setCenter((Math.min(...cxs) + Math.max(...cxs)) / 2, (Math.min(...cys) + Math.max(...cys)) / 2, { zoom: rfApi.getZoom(), duration: 300 });
      }
    }
    toast(`Duplicated ${copies.length} component${copies.length > 1 ? 's' : ''}${links.length ? ` and ${links.length} connection${links.length > 1 ? 's' : ''} between them` : ''}.`);
  }
  function selectAll() { const d = store.get().doc; store.set({ selection: { nodes: d.components.map((c) => c.id), edges: d.connections.map((k) => k.id) } }); }

      <header className="comp-head"><${Symbol} kind=${c.kind} type=${c.type} size=${40}/><div><h2>${compLabel(c)}</h2><p>${modelLabel(c)} · ${c.id}</p></div></header>
      <label className="field"><span className="f-label">Name</span>
        <input autocomplete="off" autocomplete="off" value=${c.name} placeholder="e.g. E12" onChange=${(e) => updateComponent(c.id, (x) => Object.assign({}, x, { name: e.target.value }), { physics: false })}/></label>
      ${C.modelsFor(c).length > 0 && html`<${ModelSwitch} comps=${[c]}/>`}
      ${fields.map((f, i) => {
        if (f.when && !f.when(p)) return null;
        if (f.kind === 'num') return html`<${NumField} key=${f.key} label=${f.label} unit=${f.unit} scale=${f.scale} min=${f.min} hint=${f.hint} signed=${f.signed} value=${p[f.key]} onCommit=${(v) => setProps(c.id, { [f.key]: v })}/>`;
        if (f.kind === 'effZeta') return html`<${EffZeta} key="effZeta" c=${c} res=${res} stale=${stale}/>`;
        if (f.kind === 'section') return html`<${SectionField} key=${f.key} label=${f.label} value=${p[f.key]} onCommit=${(v) => setProps(c.id, { [f.key]: v })}/>`;
        if (f.kind === 'retable') return html`<${ReZetaTable} key="retable" c=${c}/>`;
        if (f.kind === 'curve') return html`<${ZetaCurve} key="curve" c=${c}/>`;
        if (f.kind === 'info') return html`<p key=${i} className="note">${f.text}</p>`;
        return null;
      })}
      <div className="row"><button className="btn ghost" onClick=${duplicateSelection} title="Duplicate (Ctrl+D)">Duplicate</button><button className="btn ghost" onClick=${rotateSelection} title="Rotate (R)">Rotate 90°</button>
        <button className="btn ghost danger" onClick=${() => deleteItems([c.id], [])}>Delete</button></div>
      <${ResultsTable} res=${res} stale=${stale}/>
    </div>`;
  }
  /** Fixed Δp: effective ζ = (p_in − p_out)/(ρ/2·v²) at the current operating point, plus a one-click
   *  conversion to a fixed-ζ component (flow-dependent, Δp ∝ Q²) with the same Δp at this point. */
  function EffZeta({ c, res, stale }) {
    const v = (k) => res?.values?.find((x) => x.key === k)?.value, z = v('zeta');
    const ok = res && isFinite(z) && z !== null;
    const toZeta = () => updateComponent(c.id, (x) => Object.assign({}, x, { type: 'zeta', kind: 'custom', props: { zeta: +(+z).toPrecision(5), section: x.props.section } }));
    return html`<div className="field"><span className="f-label">ζ effective at the operating point${stale ? ' (out of date)' : ''}</span>
      <div><b>${ok ? fmtSmart(z) : '–'}</b>${ok ? html` <span className="f-hint">at ${fmtSmart(Math.abs(v('q')))} m³/h, v = ${fmtSmart(v('v'))} m/s</span>` : null}</div>
      <span className="f-hint">${!res ? 'Calculate the network to see it.' : !ok ? 'Undefined: no flow through the component.' : z < 0 ? 'Negative: the component adds energy to the air.' : 'Δp is held at every flow; a ζ component would scale it with Q².'}</span>
      ${ok && z > 0 && !stale ? html`<div className="row"><button className="btn ghost" onClick=${toZeta} title="Replace by a fixed-ζ component (custom kind) with this ζ: same Δp now, Δp ∝ Q² at other flows">Convert to fixed ζ = ${fmtSmart(z)}</button></div>` : null}
    </div>`;
  }
  function ResultsTable({ res, stale }) {
    if (!res) return html`<p className="note">No results yet. Calculate the network (Ctrl+Enter).</p>`;
    return html`<section className=${'results' + (stale ? ' is-stale' : '')}><h3>Results${stale ? ' (out of date)' : ''}</h3>
      <table><tbody>${res.values.map((v) => html`<tr key=${v.key}><th scope="row">${v.label}</th><td>${fmtSmart(v.value)}</td><td>${v.unit}</td></tr>`)}</tbody></table></section>`;
  }

  function ProjectPanel() {

    const f = doc.fluid; let fl = null; try { fl = C.resolveFluid(f); } catch (e) { /* shown via results */ }
    const setFluid = (patch) => commit((d) => Object.assign({}, d, { fluid: Object.assign({}, d.fluid, patch) }));
    const bg = doc.background, setBg = (patch, physics = false) => commit((d) => Object.assign({}, d, { background: Object.assign({}, d.background, patch) }), { physics });
    const msgs = [...(results?.errors || []).map((m) => Object.assign({ level: 'error' }, m)), ...(results?.warnings || []).map((m) => Object.assign({ level: 'warn' }, m))];
    return html`<div className="panel-body">
      <label className="field"><span className="f-label">Project name</span>
        <input autocomplete="off" autocomplete="off" value=${doc.name} onChange=${(e) => commit((d) => Object.assign({}, d, { name: e.target.value }), { physics: false })}/></label>
      <fieldset className="section-field"><legend>Fluid</legend>
        <div className="seg" role="radiogroup">
          <button role="radio" aria-checked=${f.mode !== 'custom'} className=${f.mode !== 'custom' ? 'on' : ''} onClick=${() => setFluid({ mode: 'air' })}>Air from T, p</button>
          <button role="radio" aria-checked=${f.mode === 'custom'} className=${f.mode === 'custom' ? 'on' : ''} onClick=${() => setFluid({ mode: 'custom', density: fl?.rho ?? 1.2, kinViscosity: fl?.nu ?? 1.5e-5 })}>Custom</button>
        </div>
        ${f.mode === 'custom'
          ? html`<div className="two"><${NumField} label="Density" unit="kg/m³" min=${0} value=${f.density} onCommit=${(v) => setFluid({ density: v })}/>
                 <${NumField} label="Kin. viscosity" unit="10⁻⁶ m²/s" scale=${1e6} min=${0} value=${f.kinViscosity} onCommit=${(v) => setFluid({ kinViscosity: v })}/></div>`
          : html`<div className="two"><${NumField} label="Temperature" unit="°C" value=${f.temperatureC} onCommit=${(v) => setFluid({ temperatureC: v })}/>
                 <${NumField} label="Pressure" unit="Pa" min=${1} value=${f.pressurePa} onCommit=${(v) => setFluid({ pressurePa: v })}/></div>`}
        ${fl && html`<div className="f-hint">ρ = ${fl.rho.toFixed(4)} kg/m³, ν = ${(fl.nu * 1e6).toFixed(3)}·10⁻⁶ m²/s</div>`}
      </fieldset>
      <fieldset className="section-field"><legend>Background drawing</legend>
        ${bg ? html`
          <label className="field"><span className="f-label">Opacity</span><input autocomplete="off" autocomplete="off" type="range" min="0.1" max="1" step="0.05" value=${bg.opacity} onChange=${(e) => setBg({ opacity: +e.target.value })}/></label>
          <div className="two"><${NumField} label="Width" unit="px" min=${10} value=${bg.width} onCommit=${(w) => setBg({ width: w, height: bg.height * w / bg.width })}/>
            <${NumField} label="Height" unit="px" min=${10} value=${bg.height} onCommit=${(h) => setBg({ height: h, width: bg.width * h / bg.height })}/></div>
          <label className="check"><input autocomplete="off" autocomplete="off" type="checkbox" checked=${bg.locked} onChange=${(e) => setBg({ locked: e.target.checked })}/> Locked (unlock to move or resize it on the drawing)</label>
          <div className="row"><button className="btn ghost" onClick=${addBackground}>Replace…</button><button className="btn ghost danger" onClick=${() => commit((d) => Object.assign({}, d, { background: null }), { physics: false })}>Remove</button></div>`
        : html`<button className="btn ghost" onClick=${addBackground}>Add background from file…</button>`}
      </fieldset>
      <section className="summary"><h3>Calculation</h3>
        ${!results ? html`<p className="note">Not calculated yet.</p>` : html`
          <table><tbody>
            <tr><th scope="row">Status</th><td colSpan="2">${results.ok ? (stale ? 'Out of date' : 'Converged') : 'Failed'}</td></tr>
            ${results.fanDp !== null && results.fanDp !== undefined && html`<tr><th scope="row">Required fan pressure</th><td>${fmtSmart(results.fanDp)}</td><td>Pa</td></tr>`}
            ${results.stats?.unknowns !== undefined && html`<tr><th scope="row">Unknowns</th><td colSpan="2">${results.stats.unknowns}</td></tr>`}
            ${results.stats?.iterations !== undefined && html`<tr><th scope="row">Newton iterations</th><td colSpan="2">${results.stats.iterations}</td></tr>`}
            ${results.ok && html`<tr><th scope="row">Max. residuals</th><td colSpan="2">${(results.stats.maxMassResidual || 0).toExponential(1)} m³/s, ${(results.stats.maxPressureResidual || 0).toExponential(1)} Pa</td></tr>`}
          </tbody></table>`}
        ${msgs.length > 0 && html`<ul className="msgs">${msgs.map((m, i) => html`<li key=${i} className=${m.level}>
          <button className="linklike" disabled=${!m.ids?.length} onClick=${() => focusIds(m.ids)}>${m.msg}</button></li>`)}</ul>`}
      </section>
    </div>`;
  }
  function Inspector() {
    const sel = useStore((s) => s.selection), doc = useStore((s) => s.doc), results = useStore((s) => s.results), stale = useStore((s) => s.stale);
    const comps = sel.nodes.map((id) => doc.components.find((c) => c.id === id)).filter(Boolean);
    let body, title;
    if (comps.length === 1) { title = 'Component'; body = html`<${ComponentPanel} key=${comps[0].id} c=${comps[0]} res=${results?.components?.[comps[0].id]} stale=${stale}/>`; }
    else if (comps.length > 1) {
      title = 'Selection';
      body = html`<div className="panel-body"><p>${comps.length} components${sel.edges.length ? ` and ${sel.edges.length} connections` : ''} selected.</p>
        <p className="note">Drag any of them to move the group. Shift-drag on empty canvas adds a box selection.</p>
        ${comps.every((c) => C.modelsFor(c).length) && html`<${ModelSwitch} comps=${comps}/>`}
        <fieldset className="section-field"><legend>Align</legend>
          <div className="align-grid">
            <button className="btn ghost" onClick=${() => alignSelection('middle')} title="All symbols on one horizontal line (Align middle)">In a row</button>
            <button className="btn ghost" onClick=${() => alignSelection('center')} title="All symbols on one vertical line (Align center)">In a column</button>
            <button className="btn ghost" disabled=${comps.length < 3} onClick=${() => alignSelection('distH')} title="Equal horizontal spacing between the outermost symbols">Distribute ↔</button>
            <button className="btn ghost" disabled=${comps.length < 3} onClick=${() => alignSelection('distV')} title="Equal vertical spacing between the outermost symbols">Distribute ↕</button>

        <div className="row"><button className="btn ghost" onClick=${duplicateSelection} title="Duplicate (Ctrl+D)">Duplicate</button><button className="btn ghost" onClick=${rotateSelection}>Rotate 90°</button><button className="btn ghost danger" onClick=${() => deleteItems(sel.nodes, sel.edges)}>Delete</button></div></div>`;
    } else if (sel.edges.length === 1) {
      const k = doc.connections.find((x) => x.id === sel.edges[0]);
      const name = (cid) => { const c = doc.components.find((x) => x.id === cid); return c ? (c.name || compLabel(c)) : cid; };
      title = 'Connection';
      body = k && html`<div className="panel-body"><p>${name(k.a.c)} (${PORT_NAMES[k.a.port]}) ↔ ${name(k.b.c)} (${PORT_NAMES[k.b.port]})</p>

    } else { title = 'Project'; body = html`<${ProjectPanel}/>`; }
    return html`<aside className="inspector" aria-label=${title}><h2 className="panel-title">${title}</h2>${body}</aside>`;
  }

  /* ---- menus / top bar ---- */

    return html`<div className="menu" ref=${ref}>
      <button className="menu-btn" aria-expanded=${open} aria-haspopup="menu" onClick=${() => setOpen(!open)}>${label}</button>
      ${open && html`<div className="menu-list" role="menu">${items.map((it, i) => it === '-' ? html`<hr key=${i}/>` :
        it.heading ? html`<div key=${i} className="menu-heading" role="presentation">${it.heading}</div>` :
        html`<button key=${i} role="menuitem" className=${it.indent ? 'indent' : ''} disabled=${it.disabled} onClick=${() => { setOpen(false); it.run(); }}><span>${it.label}</span>${it.keys && html`<kbd>${it.keys}</kbd>`}</button>`)}</div>`}
    </div>`;
  }
  function TopBar() {
    const doc = useStore((s) => s.doc), past = useStore((s) => s.past.length), future = useStore((s) => s.future.length);

    const theme = useStore((s) => s.theme), colorBy = useStore((s) => s.colorBy);
    const examples = useStore((s) => s.examples);
    return html`<header className="topbar">
      <div className="brand"><b>Luka</b><span className="proj" title="Project name (edit in the Project panel)">${doc.name}</span></div>
      <nav className="menus" aria-label="Main menu">
        <${Menu} label="File" items=${[
          { label: 'New project', run: newProject }, { label: 'Open…', keys: 'Ctrl O', run: openProject }, '-',
          { heading: 'Open example network' }, ...examples.map((ex) => ({ label: ex.title, indent: true, run: () => openExample(ex.id) })), '-',
          { label: 'Save', keys: 'Ctrl S', run: () => saveProject(false) }, { label: 'Save as…', run: () => saveProject(true) }, '-',
          { label: 'Export results to Excel', run: exportExcel }, { label: 'Import legacy .pip project…', run: () => store.set({ dialog: 'pip' }) }]}/>
        <${Menu} label="Edit" items=${[
          { label: 'Undo', keys: 'Ctrl Z', run: undo, disabled: !past }, { label: 'Redo', keys: 'Ctrl Y', run: redo, disabled: !future }, '-',
          { label: 'Select all', keys: 'Ctrl A', run: selectAll }, { label: 'Duplicate selection', keys: 'Ctrl D', run: duplicateSelection, disabled: !nSel },
          { label: 'Rotate selection', keys: 'R', run: rotateSelection, disabled: !hasSel },
          { label: 'Delete selection', keys: 'Del', run: () => deleteItems(store.get().selection.nodes, store.get().selection.edges), disabled: !hasSel }, '-',
          { heading: 'Align selected components' },
          ...ALIGN.map(([mode, label]) => ({ label, indent: true, run: () => alignSelection(mode), disabled: nSel < (mode.startsWith('dist') ? 3 : 2) }))]}/>
        <${Menu} label="View" items=${[
          { label: 'Fit network in view', keys: 'Ctrl H', run: () => rfApi?.fitView({ padding: 0.15, duration: 200 }) },
          { label: 'Zoom in', keys: 'Ctrl +', run: () => rfApi?.zoomIn() }, { label: 'Zoom out', keys: 'Ctrl −', run: () => rfApi?.zoomOut() }, '-',
          { label: (showLabels ? '✓ ' : '') + 'Show results on drawing', run: () => store.set({ showLabels: !showLabels }) },
          { label: (showMinimap ? '✓ ' : '') + 'Show overview map', run: () => store.set({ showMinimap: !showMinimap }) }, '-',
          { heading: 'Colour the drawing by' },
          ...[['power', 'Hydraulic power loss of components (W)'], ['loss', 'Pressure loss of components (Pa)'], ['throttle', 'Throttling pressure of flow controllers (Pa)'], ['pressure', 'Gauge pressure at connections'], ['none', 'Nothing']].map(([m, label]) =>
            ({ label: (colorBy === m ? '✓ ' : '') + label, indent: true, run: () => store.set({ colorBy: m }) })), '-',
          { heading: 'Appearance' },
          ...[['auto', 'Automatic (follow system)'], ['light', 'Light'], ['dark', 'Dark']].map(([t, label]) =>
            ({ label: (theme === t ? '✓ ' : '') + label, indent: true, run: () => setTheme(t) }))]}/>
        <${Menu} label="Help" items=${[{ label: 'User guide and shortcuts', keys: 'F1', run: () => store.set({ dialog: 'help' }) }, { label: 'Run self-tests', run: () => store.set({ dialog: 'tests' }) }]}/>

  function StatusBar() {
    const results = useStore((s) => s.results), stale = useStore((s) => s.stale), running = useStore((s) => s.running), doc = useStore((s) => s.doc);
    let text = 'Not calculated';
    if (running) text = 'Calculating…';
    else if (results) text = results.ok
      ? `${stale ? 'Results out of date' : 'Converged'} in ${fmtSmart(results.stats.ms)} ms, ${results.stats.iterations} Newton iterations, ${results.stats.unknowns} unknowns`
      : `Calculation failed: ${results.errors[0]?.msg || 'unknown error'}`;
    const nWarn = results?.warnings?.length || 0;
    return html`<footer className="statusbar" role="status">
      <span className=${results && !results.ok ? 'st-err' : ''}>${text}</span>
      ${nWarn > 0 && html`<button className="linklike st-warn" onClick=${() => store.set({ selection: { nodes: [], edges: [] } })}>${nWarn} warning${nWarn > 1 ? 's' : ''}</button>`}

  /* ---- dialogs ---- */
  function Dialog({ title, children }) {
    useEffect(() => { const h = (e) => { if (e.key === 'Escape') store.set({ dialog: null }); }; window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h); }, []);
    return html`<div className="overlay" onPointerDown=${(e) => { if (e.target === e.currentTarget) store.set({ dialog: null }); }}>
      <div className="dialog" role="dialog" aria-modal="true" aria-label=${title}>
        <header><h2>${title}</h2><button className="btn ghost" onClick=${() => store.set({ dialog: null })} aria-label="Close">Close</button></header>
        <div className="dialog-body">${children}</div></div></div>`;
  }
  function Dialogs() {
    const dialog = useStore((s) => s.dialog);
    if (dialog === 'help') return html`<${Dialog} title="User guide">
      <h3>Drawing a network</h3>
      <p>Drag components from the left palette onto the drawing, or click a palette entry to drop it in the middle of the view. Connect components by dragging from one port (dot) to another. A connection is a loss-free junction, so several ports can meet at one point. A port without a connection (red) is open to the atmosphere at 0 Pa gauge pressure, like an air terminal or an intake.</p>
      <p>Fittings such as bends, filters, dampers and silencers have one palette entry each. Their "ζ model" switch in the right panel chooses a fixed ζ or a Reynolds-dependent ζ (power law, table, and for bends the Krüger/Miller correlation). Switching keeps the current pressure loss where possible and remembers the settings of the other models. With several fittings selected, the switch changes all of them at once.</p>
      <p>Select a component to edit its properties on the right. Volume flows are entered in m³/h, duct sizes in mm, lengths in m. Ctrl-click or Shift-drag selects several components; drag any of them to move the group. Edit ▸ Align (or the buttons in the right panel) lines up the selected components in a row or column, or spaces them evenly, like the align functions in PowerPoint. Edit ▸ Duplicate (Ctrl+D) copies the selected components into the middle of the current view; only connections between the copied components are copied.</p>
      <h3>Calculating</h3>
      <p>With Auto-calculate on, the network is recalculated after every change. Each component gets a coloured border showing its hydraulic power loss (pressure loss × volume flow, in W), from pale (small) through yellow and orange to red (the largest loss in the network), so the components that cost the most fan energy stand out; fans are not coloured. View ▸ Colour the drawing by switches to the pressure loss of the components (Pa), the throttling pressure of the flow controllers only (teal = fully open, i.e. the critical path in fan sizing, through yellow and orange to red = most throttled; magenta = the controller lacks pressure), the gauge pressure at the connections (blue below atmosphere, orange above), or no colouring. Select a component to see all results, or export them with File ▸ Export results to Excel.</p>
      <p>A "Fixed Δp" component holds a given pressure change from technical data, whatever the flow: negative for a loss (filter, coil, air terminal), positive for a rise (booster fan). Its properties show the effective ζ at the operating point. Because the value does not change with the flow, it is exact only at the flow it was specified for; at other flows (part load, parallel branches without flow controllers) use "Convert to fixed ζ", which scales Δp with Q². Fixed-Δp components cannot form a loop on their own (all open ports count as one point).</p>
      <p>Fans deliver a fixed volume flow; their pressure rise is a result. For fan sizing, place a "Fan to be sized" and give every outlet branch a flow controller with its set flow. Luka then finds the required fan pressure: the most critical controller is fully open, all others show the throttling ζ they need.</p>
      <h3>Appearance</h3>
      <p>View ▸ Appearance switches between Light, Dark and Automatic. Automatic (the default) follows the light or dark setting of your operating system or browser. Your choice is remembered in this browser.</p>
      <h3>Keyboard shortcuts</h3>
      <table className="keys"><tbody>
        ${[['Ctrl +, Ctrl −', 'Zoom in, zoom out'], ['Ctrl H', 'Fit network in view'], ['Ctrl A', 'Select all'], ['Delete, Backspace', 'Delete selection'], ['R', 'Rotate selection by 90°'],
          ['Ctrl D', 'Duplicate selection'], ['Ctrl Z, Ctrl Y', 'Undo, redo'], ['Ctrl S, Ctrl O', 'Save, open'], ['Ctrl Enter', 'Calculate'], ['Shift + drag', 'Box selection'], ['F1', 'This guide']]
          .map(([k, v]) => html`<tr key=${k}><th scope="row"><kbd>${k}</kbd></th><td>${v}</td></tr>`)}
      </tbody></table>
      <h3>Calculation model ${C.CALC_MODEL_VERSION}</h3>
      <p>Darcy friction factor after Churchill (1977) for all flow regimes, Reynolds number from the hydraulic diameter and the true kinematic viscosity, air properties from temperature and pressure, 90° bends after Krüger with Miller's correction for rectangular sections. Results are independent of the order in which components were connected. The full technical description is in the comment block at the top of this HTML file.</p>
    <//>`;
    if (dialog === 'tests') { const res = window.LukaTests.runTests(), fails = res.filter((r) => !r.ok).length;
      return html`<${Dialog} title="Self-tests">
        <p className=${fails ? 'st-err' : ''}>${fails ? `${fails} of ${res.length} tests failed.` : `All ${res.length} tests passed.`}</p>
        <table className="tests"><tbody>${res.map((r) => html`<tr key=${r.name} className=${r.ok ? 'ok' : 'fail'}><td>${r.ok ? 'Pass' : 'Fail'}</td><th scope="row">${r.name}</th><td>${String(r.detail)}</td></tr>`)}</tbody></table>
      <//>`; }
    if (dialog === 'pip') return html`<${Dialog} title="Import a legacy .pip project">
      <p>Projects of the Python version are Python pickle files, which a browser cannot read safely. Convert them once with the small converter script that is embedded in this file:</p>
      <ol><li>Download <code>pip2json.py</code> with the button below.</li>
        <li>Run <code>python3 pip2json.py my_project.pip</code> (needs Python 3.9+ and Pillow if the project has a background image).</li>
        <li>Open the resulting <code>my_project.luka.json</code> with File ▸ Open.</li></ol>
      <p className="note">Converted projects are calculated with the corrected model, so pressures can differ from the old results, most for rectangular ducts and bends at low flow.</p>
      <div className="row"><button className="btn primary" onClick=${() => IO.download(document.getElementById('luka-pip2json').textContent.replace(/^\s*\n/, ''), 'pip2json.py', 'text/x-python')}>Download pip2json.py</button></div>
    <//>`;
    return null;
  }

  /* -------------------------------------------------------------------
   * §4.7 File actions, keyboard, boot

  function newProject() { fileHandle = null; loadDoc(IO.emptyProject()); }
  /** Embedded examples: <script type="application/json" class="luka-example" data-id data-title> blocks in §7. */
  const exampleList = () => [...document.querySelectorAll('script.luka-example')].map((s) => ({ id: s.dataset.id, title: s.dataset.title }));
  function openExample(id) {
    const all = [...document.querySelectorAll('script.luka-example')];
    const el = all.find((s) => s.dataset.id === id) || all[0];
    if (!el) { toast('No example networks are embedded in this file.', 'error'); return; }
    try { const { doc, notes } = IO.normalizeProject(JSON.parse(el.textContent)); fileHandle = null; loadDoc(doc, notes); }
    catch (e) { toast(`The example "${el.dataset.title}" could not be loaded: ${e.message}`, 'error'); }
  }
  async function openProject() {
    const f = await IO.pickFile('.json,.pip,application/json');
    if (!f) return;
    if (/\.pip$/i.test(f.name)) { store.set({ dialog: 'pip' }); return; }
    try { const { doc, notes } = IO.normalizeProject(JSON.parse(f.content)); fileHandle = null; loadDoc(doc, notes); toast(`Opened ${f.name}`); }
    catch (e) { toast(`${f.name} could not be opened: ${e.message}`, 'error'); }
  }
  async function saveProject(saveAs) {
    const doc = store.get().doc, text = JSON.stringify(doc, null, 1), name = IO.safeName(doc.name) + '.luka.json';
    try {
      if (!saveAs && fileHandle) { const w = await fileHandle.createWritable(); await w.write(text); await w.close(); toast('Saved'); return; }
      if (window.showSaveFilePicker) {
        fileHandle = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: 'Luka project', accept: { 'application/json': ['.json'] } }] });
        const w = await fileHandle.createWritable(); await w.write(text); await w.close(); toast('Saved'); return;
      }
    } catch (e) { if (e.name === 'AbortError') return; fileHandle = null; }
    IO.download(text, name, 'application/json'); toast(`Downloaded ${name}`);
  }
  function exportExcel() {
    const { doc, results, stale } = store.get();
    if (!results || stale) toast('Results are not up to date; the export contains the last calculated values.', 'warn');
    IO.download(IO.resultsWorkbook(doc, results), IO.safeName(doc.name) + '.xlsx', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  }
  async function addBackground() {
    const f = await IO.pickFile('image/*', 'dataUrl'); if (!f) return;
    const img = new Image();
    img.onload = () => {
      const r = document.querySelector('.canvas')?.getBoundingClientRect();
      const c = rfApi && r ? rfApi.screenToFlowPosition({ x: r.left + r.width / 2, y: r.top + r.height / 2 }) : { x: 0, y: 0 };
      commit((d) => Object.assign({}, d, { background: { dataUrl: f.content, x: Math.round(c.x - img.width / 2), y: Math.round(c.y - img.height / 2), width: img.width, height: img.height, opacity: 0.6, locked: false } }), { physics: false });
      toast('Background added. Drag its corners to scale it, then lock it in the Project panel.');
    };
    img.src = f.content;
  }
  function onKey(e) {
    const t = e.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
    const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
    if (e.key === 'F1') { e.preventDefault(); store.set({ dialog: 'help' }); return; }
    if (mod && k === 's') { e.preventDefault(); saveProject(e.shiftKey); return; }
    if (mod && k === 'o') { e.preventDefault(); openProject(); return; }
    if (mod && e.key === 'Enter') { e.preventDefault(); runCalc(); return; }
    if (typing || store.get().dialog) return;
    if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (mod && k === 'y') { e.preventDefault(); redo(); }
    else if (mod && k === 'a') { e.preventDefault(); selectAll(); }
    else if (mod && k === 'h') { e.preventDefault(); rfApi?.fitView({ padding: 0.15, duration: 200 }); }
    else if (mod && (e.key === '+' || e.key === '=')) { e.preventDefault(); rfApi?.zoomIn(); }
    else if (mod && e.key === '-') { e.preventDefault(); rfApi?.zoomOut(); }
    else if (mod && k === 'd') { e.preventDefault(); duplicateSelection(); }   // overrides the browser's bookmark shortcut
    else if (!mod && k === 'r') rotateSelection();
  }

  function App() {
    useEffect(() => { window.addEventListener('keydown', onKey); return () => window.removeEventListener('keydown', onKey); }, []);
    return html`<div className="app">
      <${TopBar}/>
      <main className="workspace"><${Palette}/><${RF.ReactFlowProvider}><${Editor}/><//><${Inspector}/></main>
      <${StatusBar}/><${Dialogs}/><${Toast}/>
    </div>`;
  }

  // boot: ?example[=id] loads an embedded example (default: the first), ?selftest opens the test report, otherwise restore autosave
  const params = new URLSearchParams(location.search);
  let restored = false;
  if (!params.has('example')) {
    try { const raw = localStorage.getItem(AUTOSAVE_KEY); if (raw) { const { doc } = IO.normalizeProject(JSON.parse(raw)); store.set({ doc }); restored = doc.components.length > 0; } } catch (e) { /* ignore broken autosave */ }
  }
  ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
  const afterParse = (fn) => (document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', fn) : fn());
  afterParse(() => store.set({ examples: exampleList() }));  // §7 blocks come after this script
  if (params.has('example')) afterParse(() => openExample(params.get('example'))); else if (restored) runCalc();
  if (params.has('selftest')) store.set({ dialog: 'tests' });
  window.Luka = { store, commit, runCalc, loadDoc, openExample, rf: () => rfApi }; // console access for debugging and tests
})();
}
</script>
